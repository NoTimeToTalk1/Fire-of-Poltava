l_russian:
 LOADING_TIP_0: "Україна без Криму - як птах без ноги. \n- Павло Скоропадський"
 LOADING_TIP_1: "Життя переможе смерть, а світло - темряву. \n- Володимир Зеленський"
 LOADING_TIP_2: "Проблема України в тому, що нею керують ті, хто не дбає про неї. \n- Михайло Грушевський"
 LOADING_TIP_3: "...ви як молдавани...\n- Віктор Ющенко"
 LOADING_TIP_4: "Влада без опозиції призводить до культу особи.\n- Леонід Кучма"
 LOADING_TIP_5: "Територію нашої країни треба зробити... небезпечною для проживання наших громадян...\n- Віктор Янукович"
 LOADING_TIP_6: "Не будемо говорити про погане, краще зробимо...\n- Віктор Янукович"
 LOADING_TIP_7: "Смерть Баригам!\n- Петро Моставчук"
 LOADING_TIP_8: "Ти шо, довбойоб?\n- Генадій Москаль"
 LOADING_TIP_9: "Маскву підпалить! Матрьошку зламать! Ведмідя розстрілять, сховати в дупло, їбати ведмідь!\n- Володимир Зеленський"
 LOADING_TIP_10: "Мені потрібні боєприпаси. Не літак.\n- Володимир Зеленський"
 LOADING_TIP_11: "Гетеросексуали будуть покарані згідно з законом.\n- Поліція ЛНР"
 LOADING_TIP_12: "Пішов ти нахуй зі своїм телеканалом, ти мене зрозумів?\n- Генадій Москаль"
 LOADING_TIP_13: "Миша, у тебя лицо скучное. Тебе никто денег не даст.\n- Генадій Кернес"
 LOADING_TIP_14: "І сьогодні у завтрішній день, не кожен може дивитися. Точніше, не тільки кожен може дивитичся, але декілька можуть це зробити\n- Віталій Кличко"
 LOADING_TIP_15: "Не треба скиглити. Треба брати лопату і годувати свою сім'ю.\n- Микола Азіров"
 LOADING_TIP_16: "Немає нічого страшнішого за відвагу, коли вона приречена.\n- Імам Алімсултанов"
 LOADING_TIP_17: "І що цікаво – серце у колібрі майже втричі більше, ніж шлунок. От якби так у людей. \n- Ліна Костенко"
 LOADING_TIP_18: "Україна починається з тебе. \n- В'ячеслав Чорновіл"
 LOADING_TIP_19: "Якщо у тебе нема гармонії, бери гармон і гармонізуйся! \n- Андрій Кузьменко"
 LOADING_TIP_20: "Пиздуйте нахуй отсюда, пидорасы йобаные \n- Дмитро Гордон"
 LOADING_TIP_21: "Чому дитяче порно блокується, а зброя ні? \n- Анатолій Шарій"
 LOADING_TIP_22: "Щоб спинити русофобію, тобі потрібно престати срати перед сусідовими вхідними дверима. \n- Евгеній Ройзман"
 LOADING_TIP_23: "Наша русофобія недостатня. \n- Сергій Стерненко"
 LOADING_TIP_24: "Я куплю вам ананасы, но они будут из кирпичей. И вы будете их кушать. \n- Генадій Кернес"