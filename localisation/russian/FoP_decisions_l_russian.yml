 donbass_laws: "Соціальна Політика"
 donbass_laws_desc: "У неспокійному і розділеному регіоні Донбасу, де після розпаду України виникли сепаратистські держави ДНР і ЛНР, критичні рішення щодо соціального курсу відіграють вирішальну роль у формуванні долі регіону та його мешканців. Складний соціально-політичний ландшафт, затьмарений конфліктом і територіальними суперечками, вимагає продуманих і рішучих дій, спрямованих на забезпечення стабільності, інклюзивності та процвітання."
