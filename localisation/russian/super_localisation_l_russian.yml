l_russian:
  SP_Event_odessa_war: "Війна в одесі"
  SP_Event_odessa_war_QUOTE: "З одного боку Одеса омивається морем, з іншого - степом. Степ - український, море - інтернаціональне. \n- Лев Славін"
  SP_Event_odessa_war_REMARK: "Балаклава пустилася берега"
  SP_Event_russian_ukraine_war: "Російсько-Українська Війна"
  SP_Event_russian_ukraine_war_QUOTE: "Потрібно зціпити зуби і бути жорстоким - тоді ти переможеш. \n-Еріх Марія Ремарк"
  SP_Event_russian_ukraine_war_REMARK: "Ти хотів цієї землі?"