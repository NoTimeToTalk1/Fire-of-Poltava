KHA_Radiobeam_desc: "Serhiy Zhadan, beside of being a strong poet, has a musical project behind his back, called 'Zhadan and dogs'. The sound of their rock and sorta 'people'-ish lyrics about casual routine and fun in between have attracted a fair amount of fans. This is a possibility to get the people join the cause and share the vision with interested ones."

KHA_Weapons_of_Proletariat: "Weapons of Proletariat"
KHA_Weapons_of_Proletariat_desc: "Waging a battle against the government is not an easy task. With the lack of proper equipment, civilians focus on getting anything, that can be used in the fight - from simple tools and protective gear to makeshift barricades and throwables. While the officials give their orders to armed regiments, wide masses of people are getting ready with everything they have."


war.4.t: "Moldova’s ultimatum to the Ukrainian Navy"
war.4.d: "Although Ukraine appears to have been engulfed by boundless and uncontrolled chaos, it has, seemingly, nonetheless been able to maintain a certain degree of stability in its outlying regions; yet even these strongholds of safety now seem to be nothing more than a mirage. Admiral Ihor Voronchenko, Commander of the Ukrainian Navy, who had previously managed to safeguard the Odesa and Mykolaiv Oblasts, is now the de facto leader of south-west Ukraine; until now, he was regarded as a guarantor of regional stability, but a recent statement by the Moldovan government has turned everything upside down.\nAccording to official information released by the President of the Republic of Moldova, Igor Dodon, Admiral Ihor Voronchenko’s government committed systematic acts of violence and violated the fundamental human rights of the population of the Budzhak region – the south-western part of the Odesa Oblast. President Dodon’s statement notes that Voronchenko’s “military junta” has imposed martial law in the territory under its control to deliberately oppress the region’s national minorities, namely Moldovans, Gagauz, Bulgarians, Tatars and Russians, by restricting freedom of movement, expression, assembly, etc., adding that the ultimate aim of these actions may be “the complete extermination of the indigenous peoples of Budzhak".\nPresident Dodon stated that if the government of the so-called "Black Sea Confederation" does not immediately withdraw all troops from the territory of Budzhak, the Republic of Moldova will have no choice but to use force to compel the regional government to respect the rights of national minorities and to assume the role of their protector, issuing an official ultimatum to Odesa demanding the complete and immediate demilitarisation of Budzhak. We shall find out soon enough whether Moldova receives a reply and, if so, what form it will take."
war.4.a: "Good Lord, why is this happening to us..."