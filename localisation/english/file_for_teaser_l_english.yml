l_english:
 ### Hulyaipole
HLP_descendants_of_makhno: "Descendants of Makhno"
HLP_descendants_of_makhno_desc: "The cult of Nestor Makhno is a vital part of local identity. In every house, portraits of Batko in his papakha hang next to the icons, and grandfathers' stories about how their ancestors burned Denikin's trains are passed down from generation to generation. When central authority collapsed, local men simply pulled greased sawn-off shotguns and Maxim guns from under the thatched roofs. They fight on their own land, know every ravine, and recognise no master above themselves."

HLP_Anarchist_Coalition: "Anarchist Coalition"
HLP_Anarchist_Coalition_desc: "The Huliaipole Union holds together solely through the shared desire to keep the regular armies of oligarchs and other bandits out of the district. At the same table in the Temporary Military Committee sit Kyiv and Kharkiv leftist intellectuals from the Revdiy, who quote Bakunin, run social media, and dream of building progressive eco-anarchism, alongside grim local uncles from the Nestor Makhno Society who couldn't care less about gender equality but desperately need diesel for their homemade tachankas and for no one to take their grain. For now their guns point outward, but any spark could burn this coalition to the ground."

### Khortytsia
KHO_New_Khortytsia_Sich: "New Cossack Sich"
KHO_New_Khortytsia_Sich_desc: "On the island of Khortytsia an armed closed camp has formed that declared itself 'the sole heirs of the knightly Cossacks'. Instead of the statutes of the Armed Forces of Ukraine, Cossack customary law is in force here. Otamans are elected by shouting on the circle, traitors are thrown into the Dnipro with a stone around their neck, and discipline is based on the cult of physical strength and mastery of cold and firearms. They are mobile, religious, and incredibly cruel to those they consider 'hrechkosiyi' (peasants)."

KHO_ambitions_for_zaporizhzhia: "Ambitions for Zaporizhzhia"
KHO_ambitions_for_zaporizhzhia_desc: "The Khortytsia Cossacks control the historic island and the nearby crossings, but their gaze is fixed on the giant industrial zones of Zaporizhzhia across the river - Zaporizhstal, Motor Sich and the coke plant. The Cossack starshyna understands that without control over these factories they will forever remain just a band from an island. Unfortunately for them, the plants are firmly held by other forces, and an attempt to storm the industrial giants without heavy weapons could end in catastrophe..."

KHO_gerontocracy: "Gerontocracy"
KHO_gerontocracy_desc: "Real power on the Sich is held by the Council of Elders, grey-bearded old men, local radical ethnographers, leaders of the Cossack communities of the 1990s and elderly retired military men. They pathologically despise youth, modern technology and any ideas that are not written in the chronicles of the 17th century and every military decision is discussed for hours through the prism of 'how the ancestors did it', making the governance of Khortytsia cumbersome and ossified."

### Enerhodar
ERD_trade_union_leadership: "Power of the Trade Unions"
ERD_trade_union_leadership_desc: "When the state disappeared, the workers of the Zaporizhzhia NPP and TPP under the leadership of leftist activist Oleh Vernyk did not scatter, but took the station and the city under their reinforced-concrete control. They formed a unique dictatorship of energy trade unions. Since Enerhodar holds its hand on the 'switch' of southern Ukraine, the neighbours are forced to reckon with them. Here a strict 8-hour working day is in force, free canteens operate, and the workers' self-defence detachments are armed and staffed directly from the former militarised security of the NPP."

ERD_fraud: "Dubious Reputation"
ERD_fraud_desc: "Oleh Vernyk is known in political life as the leader of many trade union movements, yet in leftist circles a trail of accusations of political opportunism, the creation of 'paper trade unions' for collecting European grants and murky connections follows him. The anarchists of Huliaipole consider him a Marxist careerist, the left radicals of Kharkiv a 'grant-eater'. Because of this Enerhodar finds itself in complete political isolation among other leftist factions, who refuse to conclude long-term alliances with Vernyk."

### Dzharylhach
KNB_pirate: "Pirate State"
KNB_pirate: "The abandoned and wild island of Dzharylhach, as well as some port zones of Skadovsk, have turned into a real Tortuga of the 21st century. Deserters from the naval forces, former poachers, smugglers who used to run cigarettes to Turkey, and criminal elements from all over the South flocked here. They converted civilian boats, fishing seiners and tugboats into combat vessels, installing heavy machine guns and anti-tank missile systems on them. Their economy is simple — robbery of merchant ships in the Black Sea, smuggling and raids on the coasts of their neighbours."

# БІЛА ЦЕРКВА
BLT_oasis_amidst_ruins: "Oasis Amidst the Ruins"
BLT_oasis_amidst_ruins_desc: "While the ideological war rages all around, Bila Tserkva is simply trying to maintain public order and municipal services. The population remains loyal, but the army is completely unready to die for grand ideas."
BLT_budget_pragmatism: "Budget Pragmatism"
BLT_budget_pragmatism_desc: "The local government's policy is strictly focused on solving local management and economic issues, rather than pursuing geopolitical expansion. This pragmatic approach allows city to maintain stable trade relations with most neighboring factions, regardless of their political alignments."

# СКВИРА 
SKV_fortress_skvyra: "Fortress Skvyra"
SKV_fortress_skvyra_desc: "Radical nationalists have turned the city and its surroundings into a heavily militarized bridgehead. A high level of patriotic indoctrination combined with rigid discipline ensures the superb combat readiness of NatAlliance personnel and the total mobilization of all available resources."
SKV_phantom_of_triumvirate: "Phantom of the Triumvirate"
SKV_phantom_of_triumvirate_desc: "Illienko's political leadership is under constant threat due to the active underground operations of the oppositional triumvirate: Yuriy Levchenko, Roman Bezsmertnyi, and Boryslav Bereza. This clandestine preparation for a coup severely disorganizes the army command and undermines public trust in the current government."

# БОГУСЛАВ
BHS_religious_hypnosis: "Religious Hypnosis"
BHS_religious_hypnosis_desc: "The charismatic influence of Pastor Sandei Adelaja has turned the local population into fanatical followers of a cult. Believers perceive any combat operations as a holy war, demonstrating a complete disregard for death, even though their actual tactical training leaves much to be desired..."
BHS_tithing: "The Desyatyna"
BHS_tithing_desc: "A rigid system of mandatory donations and aggressive confiscation of funds from parishioners has allowed the church to accumulate significant capital. All resources of the district are forcibly funneled directly into financing and arming our religious squads."

# 5.10
KHR_offshore_zone: "Offshore Zone"
KHR_offshore_zone_desc: "The total abolition of almost all state regulations and the implementation of the '5.10' system have transformed this region into the largest tax haven within the collapsed country. The absence of customs duties and regulation attracts vast amounts of capital and contraband, but the complete lack of law enforcement breeds an extremely high crime rate."
KHR_contract_defense: "Contract Defense"
KHR_contract_defense_desc: "Tax Heaven possesses no regular armed forces. The protection of the territory is entirely carried out by private security companies and mercenaries on a strictly commercial basis. They are equipped with the best gear available, but will only fight as long as the libertarian government is capable of paying for their services."
KHR_sanitary_export: "Strategic Sanitary Export"
KHR_sanitary_export_desc: "The Kyiv Cardboard and Paper Mill in Obukhiv remains the primary producer of hygiene products and cardboard across the former Ukrainian territories. Since this commodity is critically essential for all warlords, Obukhiv successfully converts the export of toilet paper into scarce industrial equipment and fuel, deterring neighbors from direct aggression due to the threat of a sanitary crisis."

# Freicor
LOZ_AntiCommunist_Zeal: "Anti-Communist Zeal"
LOZ_AntiCommunist_Zeal_desc: "Ukraine, and especially the Kharkiv region, suffered immensely at the hands of the communists in the 1930s. And now, more than 70 years later, this threat has returned. Leftist ideologies are viewed as a deadly, existential threat to the nation, so there will be no negotiations with the communists, and the Freikorps neither takes POWs nor surrenders to leftists."
LOZ_By_the_Footsteps_of_the_Black_Zaporozhians: "In the Footsteps of the Black Zaporozhians"
LOZ_By_the_Footsteps_of_the_Black_Zaporozhians_desc: "The ideological and tactical doctrine of Freikorps draws inspiration from the military traditions of the spring of 1918, when the Crimean Group of the Ukrainian People’s Republic Army, led by Colonel Petro Bolbochan, liberated the Kharkiv region from the Bolsheviks. The officer corps is raised in the spirit of the Black Zaporozhians, and the fighters view their participation in the conflict as a continuation of a century-old historical mission, which fuels their high morale and fearlessness in the face of death."
LOZ_National_Resistance: "National Resistance"
LOZ_National_Resistance_desc: "The faction operates under a regime of total mobilization, and all aspects of daily life in the areas under its control have been placed on a military footing. The Freicorps has rejected traditional party institutions, replacing them with a system of military command posts and a network of military-patriotic training programs for young people. Any attempts at dissent or the promotion of “weaknesses” such as liberalism or pacifism are brutally suppressed by the military police."
LOZ_Slobozhanshchyna_conservatism: "Slobozhanshchyna Conservatism"
LOZ_Slobozhanshchyna_conservatism_desc: "In contrast to cosmopolitan Kharkiv and its industrial satellite cities, the rural population of Slobozhanshchyna proved to be far more traditionalist, religious, and right-wing in their views. Agrarian communities, weary of chaos and political experiments, overwhelmingly support the strict, conservative order of the Freikorps. The peasants unquestioningly supply the army with food and volunteers in exchange for protection from gang racketeering and punitive raids by the communists."

# CPU
KUP_Red_Brown_Compromise: "Red-Brown Compromise"
KUP_Red_Brown_Compromise_desc: "The Communist Party of Ukraine has entered into an alliance with local pro-Russian separatists, turning Kupiansk into an industrial and railway hub for a left-wing revanche. Soviet nostalgia is aggressively exploited to mobilize the older generation and railway workers, while the combat effectiveness of regular units remains poor."
KUP_Humanitarian_convoys_from_Russia: "Humanitarian Convoys from Russia"
KUP_Humanitarian_convoys_from_Russia_desc: "Russian assistance arrives under the guise of humanitarian aid. Food, medicine and other supplies are accompanied by weapons, ammunition and volunteers sent to reinforce the Soviet Republic. Without Russian support, maintaining the war effort would be considerably more difficult."
KUP_Basements_of_Oplot: "'Oplot' Basements"
KUP_Basements_of_Oplot_desc: "Oplot, the organization that operated in Kharkiv in 2014, has been resurrected. Its members now terrorize the population and hunt down dissidents, opposition activists and anyone suspected of disloyalty. The old networks of Oplot have once again turned basements, warehouses and abandoned buildings into places of interrogation and detention."

KHA_Turboatom_and_KhTZ_Consortium: "Turboatom–KhTZ Consortium"
KHA_Turboatom_and_KhTZ_Consortium_desc: "The military administration has forcibly consolidated Kharkiv's industrial capacity. Turboatom and the Kharkiv Tractor Plant have been placed under a single emergency production system, with their machinery, workforce and facilities redirected toward the rapid repair and production of military equipment."
KHA_Kharkivs_Bespredel: "Kharkiv's Bespredel"
KHA_Kharkivs_Bespredel_desc: "The police have been given virtually unrestricted power, and their abuses have become impossible to ignore. The city is gripped by a wave of mass protests. On Sumskaya Street, Pushkinskaya Street, and Freedom Square, violent clashes break out daily between protesters, mostly radical students from Kharkiv National University and Kharkiv Polytechnic Institute and the police."
KHA_Tactical_Alliance: "Tactical Alliance"
KHA_Tactical_Alliance_desc: "The regime is sustained by a cynical compromise between Arsen Avakov and the local nomenclature. Hennadiy Kernes and Ihor Rainin struck a deal, using Yulia Svitlychna as a coordinated political tool for governing the region. Long-standing internal rivalries have been temporarily set aside in order to maintain control over shadow financial flows, the “Barabashovo” market, and what remains of the executive power structure."

### PST ###
PST_shadow_of_former_glory: "Shadow of Former Glory"
PST_shadow_of_former_glory_desc: "After Dmytro Yarosh's departure and the split of the organization, Right Sector lost most of its political influence and the bulk of its volunteers. The movement found itself on the brink of oblivion, turning from a formidable force into a local paramilitary formation that holds its positions on the periphery only thanks to financial injections from Dnipro."
PST_oligarchic_sustenance: "Oligarchic Sustenance"
PST_oligarchic_sustenance_desc: "Being a puppet of the Oligarchs' Conglomerate, Right Sector is completely dependent on the supply of fuel, weapons and ammunition from the regional centre. This forces the radicals to serve as a living shield for Dnipro, despite the internal discontent of the rank-and-file fighters with their capitalist masters."
PST_prava_molod: "Prava Molod"
PST_prava_molod_desc: "Graduates of the Prava Molod training camps have become the backbone of the new divisions defending the Right Sector's heartland. Young men and women raised on nationalist ideas are ready to defend the Sicheslav Redoubt, but their youthful maximalism often gets out of control and carries the risk of further radicalisation."

### KRY ###
KRY_vilkul_bonapartism: "Vilkul's Bonapartism"
KRY_vilkul_bonapartism_desc: "The local city authorities have completely monopolised control over the industrial giant. The political course rests solely on the personal authority of the mayor and his ability to manoeuvre between the patriotically minded military and security forces on one side and the influential pro-Russian circles from the former Opposition Bloc on the other."
KRY_political_split: "Political Split"
KRY_political_split_desc: "Attempts to satisfy two opposing and radical political forces within the city paralyse any decisive action by the government. Trying to suppress the pro-Russians will cause the Kryvorizhstal plant to stop due to sabotage by managers, while pressure on the pro-Ukrainian forces will lead to an armed uprising of the garrison."
KRY_horrible_ecology: "Horrible Ecology"
KRY_horrible_ecology_desc: "The huge metallurgical plants operate without any environmental restrictions, covering the city in red dust. The life expectancy and health of potential conscripts leave much to be desired."

### NIK ###
NIK_grassroots_democracy: "Grassroot Democracy"
NIK_grassroots_democracy_desc: "Power in the city belongs to a coalition of independent metallurgists' and railway workers' trade unions and labour collectives. Decisions are made through open discussions and voting. Every enterprise is managed by the workers themselves, who elect the management and control the distribution of resources, while in the army the fighters elect junior commanders and have a say in the tactical actions of their units."
NIK_antiauthoritarian_militarism: "Anti-Authoritarian Militarism"
NIK_antiauthoritarian_militarism_desc: "Fighting for socialist ideals is the duty of a free person, not a slave. SotsRukh categorically rejects forced mobilisation by the 'crutch' methods of military enlistment offices or the creation of Bolshevik-style barrier troops. Military discipline is built on the authority of elected commanders, which makes the army highly motivated, but under severe pressure from neighbours the volunteer approach is unable to ensure mass conscription."
NIK_syndicalist_bureaucracy: "Syndicalist Bureaucracy"
NIK_syndicalist_bureaucracy_desc: "The extensive rights of workers, as well as the right of every trade union representing certain professions to participate in decision-making, slow down the work of the state apparatus, dragging the resolution of even simple issues out for months or even years. In the army, soldiers also defend their rights, refusing to carry out commanders' orders when they deem it necessary."

### DNI ###
DNI_one_big_business: "One Big Enterprise"
DNI_one_big_business_desc: "Dnipro is a unique administrative entity with no parliament, no ministers and no single leader. The territories are governed by a conglomerate of oligarchs and representatives of big business, who have divided up the industries and individual sectors for the sake of effective management. Dnipro is one big business run by managers and directors; here, the focus is solely on profit and quarterly reports, rather than on higher values."
DNI_nothing_personal_just_business: "Nothing Personal, Just Business"
DNI_nothing_personal_just_business_desc: "To maintain order and protect their businesses and trade routes, every major company has its own private army, which operates to ensure the flow of goods or the uninterrupted operation of machinery. Some also provide security for their workers. There is a complex structure of agreements and relationships between all these private armies, based on two principles: not to cut each other’s throats, and, if necessary, to present a united front to protect business interests. They all differ in terms of their equipment, charters, rank systems and, most importantly, their owners."
DNI_working_conditions: "Working Conditions"
DNI_working_conditions_desc: "To ensure the most favourable conditions for the production of goods and the provision of services, regulations governing working hours, breaks and wages have simply been abolished. Many residents are faced with a choice: to starve to death or to work for a pittance in appalling conditions. Trade unions are intimidated by private thugs and are virtually unable to operate; every business has a team of strike-breakers ready to make conditions even worse if necessary."
DNI_eldorado_on_dnipro: "Eldorado on Dnipro"
DNI_eldorado_on_dnipro_desc: "Thanks to cooperation across various business sectors, negligible labour costs and the tax and customs regime, Dnipropetrovsk has become an economic behemoth rising from the ruins of Ukraine. The wealthy are living the high life thanks to high demand for goods both within the region and beyond. Even without Nikopol and Kryvyi Rih, the conglomerate is thriving by developing various sectors of the economy, ranging from agriculture to heavy industry."
DNI_chaos_at_the_gates: "Chaos at the Gates"
DNI_chaos_at_the_gates_desc: "Given that the conglomerate of managers and businesspeople has no interest in public safety or anything unrelated to business, a situation verging on complete anarchy is developing, with the exception of control over key roads and railway junctions. The absence of laws and any enforcement of them in most communities creates an ideal environment for ideological fanatics, looters and bandits. From time to time, private armies engage in firefights or are ambushed, yet no one has any plans to pursue them or carry out targeted eliminations. For the time being, this does not hinder business."

### MYK ###
MYK_poor_younger_brother: "Poor Little Brother"
MYK_poor_younger_brother_desc: "Mykolaiv is also a major port city, much like Odesa, yet it has always remained greyer, poorer and more neglected. Its industry is in a miserable state and everyday life offers little hope. This weakness made it easy for the admiral to bring the city firmly under his control."
MYK_gentle_coup: "Gentle Coup"
MYK_gentle_coup_desc: "The former BPP governor Savchenko quietly stepped aside. The Poroshenko loyalists offered no real resistance. In the resulting vacuum the admiral installed Kim in power, completing a soft and almost bloodless transfer of authority."
MYK_mayor_governor_friendship: "Friendship of the Mayor and the Governor"
MYK_mayor_governor_friendship_desc: "Kim maintains close personal ties with Mykolaiv’s mayor Senkevych. Thanks to this genuine friendship the two men have managed to preserve at least a measure of stability and basic governance in the city despite the surrounding chaos."

### BDT ###
BDT_isolation_from_odesa: "Cut-off from Odessa"
BDT_isolation_from_odesa_desc: "At present, Budzhak is effectively cut off from the rest of Ukraine. Due to its unique geographical location, the M-15 motorway provides the link with the rest of the country. The problem is that it runs through Moldovan territory. Previously, the Black Sea administration had managed to reach agreements with the Moldovan government; however, these agreements are no longer valid. There is also the sea route, which is suitable for large consignments of goods, but is slower and less secure"
BDT_dictatorship_of_the_marines: "Dictatorship of the Marines"
BDT_dictatorship_of_the_marines_desc: "Power in Budjak rests with the marine detachments appointed by the admiral and commanded by Mykola Palas. The region is run as a military fiefdom and the will of the naval infantry is law."
BDT_national_minority_protests: "Minority Dissatisfaction "
BDT_national_minority_protests_desc: "Budzhak is unique not only for its geography, but also for its national, ethnic and religious composition. It is home to Bulgarians who settled here in the late 18th and early 19th centuries, during mass migrations from the Ottoman Empire. There is also a large diaspora of Romanians and Moldovans, who lay claim to this territory and controlled it following the collapse of the Russian Empire. It is also important to take into account the large Russsians population and the community of Turkic Gagauz people. All of them maintain links with their respective national governments, seeking to protect their distinctive cultures and consolidate their own dominant position."
BDT_moldovan_encroachments: "Moldovan Encroachments"
BDT_moldovan_encroachments_desc: "Moldova has most of Bessarabia, of which Budzhak forms part. This region is of paramount importance due to its strategic access to the Black Sea, which could provide a sea route for the export of goods independent of Romania and give a boost to the economy of their young country. They already possess key levers of influence over us through their control of the motorway and close ties with the Moldovan community, which makes up a significant proportion of the population. There are also clear signs of the involvement of Igor Dodon, a moldovan president, who is exerting pressure on us via the Gagauz diaspora. They also have arguments regarding legitimacy. Many claim that the loss of this territory is allegedly not properly enshrined in ratified international treaties, which gives them every right to establish control."

### MLD ###
MLD_echoes_of_the_transnistrian_war: "Echoes of the Transnistrian War"
MLD_echoes_of_the_transnistrian_war_desc: "Although the Transnistrian War ended more than two decades ago, its consequences remain profound in the present state of the Republic of Moldova. Following the catastrophic defeat of the Moldovan forces at the Battle of Bender in 1992, the ceasefire agreement signed between the parties directly led to Moldova adopting neutral status, blocking the country’s path to European integration and cementing the presence of the separatist entity, the Pridnestrovian Moldavian Republic, on the opposite bank of the Dniester. This turn of events brought unprecedented changes to the internal structure of the young republic, leaving it with no choice but to wake up to the sight of its greatest failure on the other side of the river every single day."
MLD_political_theatre_of_two_actors: "Political Theatre of Two Actors"
MLD_political_theatre_of_two_actors_desc: "2019 in Moldova was marked by a major constitutional crisis, which stripped the republic of its chief oligarch-curator and led to the unprecedented formation of a coalition between pro-European liberal democrats and pro-Russian socialists. Having divided the verticals of power between themselves, President Igor Dodon and Prime Minister Maia Sandu set about building a new order; however, a vote of no confidence in Sandu put an end to the unexpected alliance, sending the temporary allies back to opposite sides of the barricades."
MLD_shadow_of_plahotniuc: "The Shadow of Plahotniuc"
MLD_shadow_of_plahotniuc_desc: "Vlad Plahotniuc, also known as "The Puppet Master", was Moldova's shadow powerbroker and most powerful oligarch for an entire decade. As a wealthy businessman, he relentlessly expanded his influence behind the brand of the Democratic Party and eventually gained control over all levels of government, until, in 2019, his brazen attempt to undermine the fledgling coalition of liberals and socialists led to the collapse of his shadow empire. Plahotniuc is currently in hiding abroad, having lost most of his former influence, but despite this, his shadow still looms over Chișinău."

### ODE ###
ODE_neutral_side: "Neutral Side"
ODE_neutral_side_desc: "Whoever claims the presidency or supreme command elsewhere is irrelevant. Local authority simply maintains an island of relative order and everyday normality, deliberately staying above the ideological storms that tear the rest of the country apart."
ODE_democratic_tendencies: "Democratic Tendencies"
ODE_democratic_tendencies_desc: "Opposition groups of various stripes constantly complain about the absence of real democracy and civilian oversight. Their protests and public criticism erode legitimacy and force the authorities to spend political capital on damage control."
ODE_odesa_trade_hub: "Odesa Trade Hub"
ODE_odesa_trade_hub_desc: "The port remains the beating heart of the Black Sea trade. Grain, contraband, fuel and every other commodity flow through the harbours. Smuggling networks and legitimate commerce intertwine, bringing money, goods and people into the city."
ODE_patchwork_confederacy: "Patchwork Confederacy"
ODE_patchwork_confederacy_desc: "Control over the northern villages and rural districts is weak and uneven. The administrative system is a loose patchwork of local governors and improvised arrangements. Decentralisation is extreme, yet the structure somehow holds together through inertia and mutual interest."

### LVI ###
LVI_establishment_coalition: "Coalition of the Establishment"
LVI_establishment_coalition_desc: "After the collapse of central authority the three strongest local parties — Poroshenko’s bloc, Tymoshenko`s Batkivshchyna and Svoboda closed ranks rather than fight each other. Together they control the regional council, most district administrations and the bulk of the remaining budget. Smaller parties and independent groups are either absorbed through appointments or starved of resources and access to local media. The arrangement is crude, but it keeps the Lviv from fragmenting and leaves little room for anyone outside the deal."
LVI_nationalist_front: "Nationalist Front"
LVI_nationalist_front_desc: "Ruslan Koshulynskyi, a long-time Svoboda figure, has become the rallying point for those who consider the regional coalition too soft and too willing to trade principles for posts. He draws open support from nationalists, both Svoboda moderates and radicals, OUN circles, KUN and the Tryzub activists who still treat street mobilisation as a normal political tool. Their pressure does not topple the establishment, yet it forces every major decision to take into account the risk of open accusations of betrayal."
LVI_opposition_capital: "Opposition Capital"
LVI_opposition_capital_desc: "Samopomich never built a serious machine beyond Lviv itself, and on the regional level it remains a secondary player. The decisive fact is that Andriy Sadovyi still holds the city. Lviv’s budget, police coordination and most practical levers of power stay with the city hall, which refuses to give up to the regional coalition. As long as the mayor keeps the city functioning and avoids a direct clash, the rest of the region has to live with an opposition-controlled capital in its centre."


### IVF ###
IVF_establishment_coalition: "Coalition of the Establishment"
IVF_establishment_coalition_desc: "The same three parties that dominate most of Halychyna, Poroshenko’s bloc, Tymoshenko`s Batkivshchyna and Svoboda also hold the main levers in Ivano-Frankivsk. They share posts, control the regional council and keep smaller groups away from real decisions. The system is not elegant, but it prevents open factional collapse and leaves little space for anyone outside the agreement."
IVF_unp_urp_rivalry: "UNP–URP Rivalry"
IVF_unp_urp_rivalry_desc: "Local politics is still split by the old argument between the heirs of Levko Lukianenko and those of Viacheslav Chornovil. One side treats independence as a matter of hard principle and distrusts any compromise; the other insists on pragmatic state-building and broader coalitions."
IVF_bukovel_resort: "Bukovel Resort"
IVF_bukovel_resort_desc: "Bukovel remains the largest resort complex in the Carpathians and one of the few places that still generates steady cash. At the same time it functions as a practical base for UKROP and its local network around Batenko. Control over the resort means access to money, jobs and informal influence that ordinary party structures cannot match."
IVF_chupacabra_attacks: "Chupacabra Attacks"
IVF_chupacabra_attacks_desc: "Reports of livestock killings keep coming from mountain villages across Prykarpattia. No one has produced a clear explanation, but the attacks are real enough to damage small farms and spread unease. Local authorities spend time and resources on patrols and compensation instead of more useful work, while rumours fill the gap left by the lack of facts."


### BRZ ###
BRZ_last_bastion: "Last Bastion"
BRZ_last_bastion_desc: "Officials and units that refused to accept the neo-pagan takeover of Ternopil regrouped on the remaining free territory. They still claim continuity with the old regional authority and treat any further loss of ground as unacceptable. Available forces are limited, so the priority is holding the current line and preventing the enemy from pushing deeper into the oblast."
BRZ_administrative_collapse: "Administrative Collapse"
BRZ_administrative_collapse_desc: "Most of the former Ternopil oblast lies outside real control. Districts, roads, factories and tax offices are either lost or unreachable. The administration issues orders and keeps formal structures running, yet it lacks the staff, records and transport needed to govern more than a narrow strip of land."
BRZ_field_capital: "Field Capital"
BRZ_field_capital_desc: "After the fall of Ternopil the administration relocated to Berezhany. The town has no proper facilities for a regional government, communications break down and key specialists are missing. Decisions are made slowly and under constant shortage of information, money and manpower."

### DRH ###
DRH_safe_haven: "Safe Haven"
DRH_safe_haven_desc: "After the regional coalitions closed ranks elsewhere, a mixed group of opposition politicians moved to Drohobych. Members and allies of Hrytsenko’s networks, Samopomich, Holos, smaller liberal and centre-right groups found space here that they no longer had in Lviv or Ivano-Frankivsk. Sadovyi’s city hall in Lviv provides limited political cover, which helps the local arrangement survive without open confrontation."
DRH_megapolis_drohobych: "Megapolis Drohobych"
DRH_megapolis_drohobych_desc: "Drohobych, Truskavets, Boryslav and Stebnyk function as one economic zone. Shared infrastructure, labour and local budgets give the administration a denser resource base than most neighbouring towns. Control over this cluster determines how much fuel, money and manpower the government can actually mobilise."
DRH_technocratic_government: "Technocratic Government"
DRH_technocratic_government_desc: "The local leadership presents itself as a practical administration rather than a party project. Priority goes to keeping enterprises running, securing fuel and maintaining basic services. This approach has drawn quiet support from industrial interests that care more about stability of production than about ideological labels."

### PHM ###
PHM_migration_crisis: "Migration Crisis"
PHM_migration_crisis_desc: "Three border checkpoints under Polish control have become collection points for people fleeing the collapse further east. Camps and temporary shelters grew around them faster than local capacity could handle. Food, water and basic order now depend on continuous external deliveries, while overcrowding produces constant friction between arrivals, local residents and the administrators on site."
PHM_warsaw_humanitarian_support: "Warsaw Humanitarian Support"
PHM_warsaw_humanitarian_support_desc: "Regular convoys from Poland bring food, medicine, fuel and cash. Without these shipments the camps and the surrounding settlements would lose the ability to feed people and keep basic services running. The flow of aid also gives Warsaw direct leverage over decisions taken on the ground."
PHM_population_distrust: "Population Distrust"
PHM_population_distrust_desc: "Many local Galicians largely refuse to treat the Polish presence as neutral relief work. The checkpoints were secured by force, and the absence of a formal Polish army on the ground does not remove the fear that Warsaw could send regular units if it decides the UN framework no longer binds it."


### TER ###
TER_kupala_rebellion: "Kupala Rebellion"
TER_kupala_rebellion_desc: "Ternopil region and the Medobory hills remain a land where the spirit of ancient paganism still lives. After the native-faith believers seized power, Ternopil turned into a fanatical stronghold of their creed — strict, closed and ready to defend its gods, shrines and old traditions by force against any outside influence."
TER_galician_vendee: "Galician Vendée"
TER_galician_vendee_desc: "The violent overthrow of Christian institutions, the desecration of churches and the burning of religious literature provoked fierce resistance from the conservative majority of the region. The inland districts of Ternopil oblast are now plagued by partisan activity of Greek-Catholic and Orthodox rebels, forcing the Viche to keep substantial forces in the rear for constant punitive operations."
TER_power_of_the_volkhvs: "Power of the Volkhvs"
TER_power_of_the_volkhvs_desc: "State administration has been completely replaced by an archaic system of direct military democracy, the Viche, under the ideological control of the priestly class. Justice is administered according to customary law and the principles of Ruska Pravda."

### HUT ###
HUT_carpathian_neutrality: "Carpathian Neutrality"
HUT_carpathian_neutrality_desc: "The Hutsuls have never sought empire or ideology. High in the Carpathians they simply live by their own customs, trade little with the outside world and refuse to be drawn into the wars of the lowlands. Their valleys remain an island of stubborn peace and isolation."

### HDC ###
HDC_heritage_of_the_hadiach_treaty: "Heritage of the Hadiach Treaty"
HDC_heritage_of_the_hadiach_treaty_desc: "In 1658 Hadiach was the place where the Cossack elite tried to create the Grand Duchy of Ruthenia as an equal member of the Commonwealth of Both Nations. Local activists treat that episode as a direct precedent. A broad committee of teachers, ATO veterans, small entrepreneurs and the Ridne Misto party now runs the town and refuses orders from outside strongmen, agrobarons or any force that claims authority without consent."
HDC_gas_sovereignty: "Gas Sovereignty"
HDC_gas_sovereignty_desc: "Hadiach district sits on major gas-condensate fields, including Hadiach, Hlynsko-Rozbyshivske and Seredniakivske. For years Poltava fought Kyiv over the rent from these wells. After the collapse the technical crews stayed on the sites, kept the equipment running and organised local processing of condensate. Revenue from gas now covers salaries, fuel and basic administration, so the town does not depend on external subsidies."
HDC_old_guard: "Old Guard"
HDC_old_guard_desc: "Volodymyr Udovychenko still aims to bring the wider Poltava region back under the same network that ran it during the Yanukovych years. The local party structure is headed by Oleksandr Koval, former deputy head of the Poltava regional administration from that period. Their people hold key informal levers and treat the current arrangement in Hadiach as a temporary base rather than a final settlement."

### LUB ###
LUB_sugar_paternalism: "Sugar Paternalism"
LUB_sugar_paternalism_desc: "The former mayor of Poltava fled to Lubny following the Nazi coup and cultivated an image as a capable administrator. He is attempting to establish himself as the region’s legitimate leader and is employing rather populist propaganda tactics, playing on nostalgia for pre-revolutionary and Soviet times."
LUB_kulinich_shadow_lobby: "Kulinich's Shadow Lobby"
LUB_kulinich_shadow_lobby_desc: "The Dovira Party capitalises on its links with the agricultural giant Kernel, Ukraine’s largest exporter of grain and sunflower oil. They use these connections to engage in smuggling and gain access to the black market. However, these connections come at a price: Kernel funds their political programme in order to lobby for its own interests in the region."
LUB_posullya_latifundists: "Latifundists of Posullya"
LUB_posullya_latifundists_desc: "It is common knowledge that farmers have always been renowned for their reverence and unspoken solidarity within their community, even in the modern world. Former tractor drivers, combine harvester operators and agronomists took up arms and refused to allow either of the warring sides onto their fields. They refused to recognise any of the surrounding governments, focusing instead on communal living and agriculture."

### KRM ###
KRM_united_we_stand: "United We Stand"
KRM_united_we_stand_desc: "Poltava became a key region, and it was from here that the flames of radicalism spread throughout Ukraine. Kremenchuk was the exception; the local population refused to accept Biletsky’s nationalists. Despite being in the minority, a situation unique for Ukrainians emerged, characterised by mutual acceptance, solidarity and unity against the enemy. Only in Kremenchuk do trade unions and the state work together, and do liberals, leftists and moderate nationalists coexist. All this is in the face of the common threat of torture and chaos brought about by the notorious ‘Black Squadrons’ punitive forces. "
KRM_oligarch_influence: "Good Business - Bad Boss"
KRM_oligarch_influence_desc: "The city of Kremenchuk is the industrial heart of the region; unlike Poltava, Kremenchuk is home to industrial facilities in the automotive, chemical and metalworking sectors. Among these enterprises are subsidiaries of Ukrainian monopolies, controlled by oligarchs. Following the revolution, all enterprises passed into private hands, which, whilst contributing to high production efficiency, also supports employment. However, there is another side to this coin. Industry is concentrated in the hands of pre-war magnates, the majority of whom act in their own interests rather than those of the state and are prepared to put pressure on our government for their own gain."
KRM_city_besieged: "A City Besieged"
KRM_city_besieged_desc: "The city is under siege. Martial law has been declared, and the curfew is enforced with equal rigour. As darkness falls, the streets are left in the hands of patrols and silence. Food exists only on paper. Special food ration cards, bearing stamps and numbers, are the only currency of survival. Distribution points open for a few hours a day according to a timetable that changes without warning. Rations are being cut week by week. Almost everything that reaches the city still comes via the worn-out supply line from the Dnipro government. And even when supplies do arrive, there is never enough. The city is holding out, but the tension is palpable at all times. This cannot go on. No city, however resilient it may be, can withstand such harsh blockade indefinitely."
KRM_last_stand: "Last Stand"
KRM_last_stand_desc: "Following the establishment of Biletsky’s far-right junta in Poltava, units of the National Guard and special police detachments retreated in panic to Kremenchuk. Their route to Kharkiv had been cut off, and the city authorities welcomed them warmly, thinking primarily of protection against the nationalists. National Guard units are demoralised by heavy losses and crushing defeats; their stores are running empty, and desertions are becoming increasingly common. Officers are witnessing a decline in morale within their units, yet they try to hold on - nationalists won't leave them so easily."
### ZLT ###
ZLT_gladiators_of_vatutin: "Field Marshal Vatutin’s Gladiators"
ZLT_gladiators_of_vatutin_desc: "Vatutin’s forces consist of extremely unreliable and bandit-like elements, hastily recruited to capture the Kaniv HPP. Most of them cannot cope with army discipline, live by a code of thieves, and some are prepared to sell their assault rifles for vodka the moment the next shipment arrives. Ideologically, brave ‘gladiators’ reject Ukrainian influence and preach a reactionary nostalgia for the Soviet past, yet in practice they care more about the next bottle and the chance to loot anything that isn’t nailed down."
ZLT_mvs_credentials_from_president: "A Patent On Violence"
ZLT_mvs_credentials_from_president_desc: "Strange as it may sound, Vatutin’s pro-Soviet militants are operating with the direct blessing of Ukraine’s former president. Poroshenko was forced to turn a blind eye to their atrocities, roadside shakedowns and highly controversial ideological agenda in order to establish control over the hydroelectric power station. However, despite their formal friendship or even subordination, in practice local leaders and selected commanders are distancing themselves from the mission to uphold Poroshenko’s authority in the region, treating the whole arrangement as little more than a temporary licence to rob and settle scores."
ZLT_death_march_on_kaniv: "Death March on Kaniv"
ZLT_death_march_on_kaniv_desc: "Poroshenko has given us a patent to use violence, and we will fulfil the terms of the agreement. All our forces will be directed towards the Kaniv HPP. Just greed, revenge without any discipline and the order to ‘take it at any cost’. For the thugs, Kaniv is not a strategic target, but a trophy to be stripped bare. And they will crawl through minefields, over the bodies of their own comrades, and through the ruined sluice gates, until the dam either collapses or drags them all down to the bottom with it. And as long as Kaniv stands, they will not stop. And when it falls, they will move on to the next prize, leaving only empty bottles and bullet casings behind."

### PLT ###
PLT_poltava_sparta: "Poltava Sparta"
PLT_poltava_sparta_desc: "National Corps under Andriy Biletsky treats Poltava as a closed military camp. Command, propaganda and recruitment all run through the same hierarchy. Opposition inside the controlled area is not negotiated with; it is removed. The result is a compact, aggressive force that answers only to its own leadership."
PLT_stsiborsky_natiocracy: "Stsiborsky's Natiocracy"
PLT_stsiborsky_natiocracy_desc: "The regime adopted Mykola Stsiborsky’s natiocracy as official doctrine: one nation, one organising party, no room for liberal institutions or class politics. In practice the apparatus is still thin — few cadres, little industry, almost no reserves — so the doctrine remains at the stage of decrees, political police and street control rather than a finished total state."
PLT_terror_of_the_black_men: "Terror of the Black Men"
PLT_terror_of_the_black_men_desc: "Armed groups in black uniforms run the streets without courts or written procedure. Public executions and collective punishments are used to break any sign of resistance. Fear keeps the remaining population quiet, while skilled people and draft-age men disappear from the city through flight or arrest."
PLT_toxic_nest: "Ulranationalist Nest"
PLT_toxic_nest_desc: "From Poltava, Biletsky’s network sends organisers and small armed cells into other regions. These groups receive money, instructions and political cover from the centre and work to destabilise local authorities. Most of them are too weak to seize power on their own, yet they force every neighbouring administration to divert men and attention to internal security."

POLITICS_ODE_VORONCHENKO_DESC: "Ihor Oleksandrovych Voronchenko was born on August 22, 1964 in Kharkiv Babai. The future admiral dreamed of a military career since childhood and in 1986 he graduated from the Tashkent Higher Tank Command School, after which he joined the Group of Soviet Forces in Germany, where he commanded a tank platoon. After 2 years, he returned to the USSR, where he continued his military service in the Belarusian Military District, and from 1986 to 1992 served in military service in positions ranging from platoon commander to chief of staff — deputy commander of a tank battalion. After the collapse of the Union, he returned to the Motherland and took an oath of loyalty to the people of Ukraine. Until 2003, he commanded a regiment of the National Guard in Crimea, and then became part of the Navy of the Ukrainian Armed Forces, where he held the responsible positions of department head and department head. From 2007 to 2011, he served in senior positions in the Joint Operational Command of the Armed Forces of Ukraine. In 2011–2015, he held the position of Deputy Commander of the Navy of the Armed Forces of Ukraine for Coastal Defence. On December 6, 2013, Colonel Ihor Voronchenko was awarded the military rank of Major General. In 2014, for six months, he participated in the anti-terrorist operation in the Luhansk region, where he was the coordinating deputy head of the anti-terrorist operation. On October 14, 2015, he was awarded the military rank of lieutenant general. In 2016, he was appointed acting the commander of the Navy of the Armed Forces of Ukraine and then, in the same year, President of Ukraine Petro Poroshenko appointed Voronchenko as the commander of the Navy of the Armed Forces of Ukraine and awarded him the military rank of vice admiral. In 2018, Ihor received the rank of admiral. When Ukraine was engulfed in chaos, now Admiral Voronchenko was not lost. While in Odesa, he, together with the headquarters of the Armed Forces Navy, declared a state of emergency in the region and organized a military administration, similar to Kryvonos in the east. But unlike Kryvonos, Voronchenko did not please everyone, but in order to maintain stability, the majority of the population of the region cooperates with the military authorities."
POLITICS_Mykola_Palas_DESC: "Mykola Dmytrovych Palas was born on May 26, 1980, in the village of Dmytrivka, Bolhrad Raion, Odesa Oblast. He is of Gagauz ethnicity. Raised in a large family of teachers, he has four brothers. He is married and has three children. In 2001, he graduated from the Odesa Institute of Land Forces. He began his service with the 25th Separate Airborne Brigade, rising from platoon commander to deputy brigade commander. From 2004 to 2005, he participated in a peacekeeping mission in Iraq. In February and March 2014, he was stationed in Crimea with a composite company of paratroopers; he refused to surrender his weapons and successfully withdrew his personnel and equipment to mainland Ukraine. From 2014 onwards, he took part in the Anti-Terrorist Operation and the Joint Forces Operation in eastern Ukraine. In 2018–2019, he commanded the newly formed 35th Separate Marine Brigade named after Rear Admiral Mykhailo Ostrohradskyi. Following the collapse of central authority, Admiral Voronchenko dispatched Palas to the Budzhak region with the mission of stabilizing the area and establishing Marine control over the territory."
POLITICS_Slevin_Totsky_DESC: "Slevin Totsky is a Ukrainian author and popularizer of Rhodesian military history. He is the founder and host of the Ukrainian-language Telegram channel "Rhodesian Front" (@rhodie_front), which focuses on the history of the Rhodesian Security Forces, the Bush War, and special operations units. He has regularly published analytical articles and translations on the Militarnyi website, covering topics such as Rhodesian SAS operations, raids like Operation Dingo, counter-insurgency tactics, and specific instances of foreign participation in the conflict. Following the collapse of central authority, he relocated to Budzhak, where he gathered a small group of enthusiasts interested in Rhodesian history; together, they engage in historical military reenactment and airsoft training modeled after Rhodesian Security Forces units."
POLITICS_MYK_KIM_DESC: "Vitaly Oleksandrovych Kim, born on March 13, 1981 in Mykolaiv. He was the son of an honored basketball coach of the USSR and became a national team player himself at a young age. Having Korean roots, he is a descendant of national minorities deported from Central Asia to the border regions of the Prison of Nations. A graduate of the Mykolaiv Gymnasium No. 2 and the National Shipbuilding University named after Adm. Makarov and since 1998 engaged in entrepreneurial activities. From 2005 to 2011, he held management positions in a number of Mykolaiv enterprises specializing in international investment activities, and in 2015-16 he participated in the organization of work and management of the analytical department of the Ministry of Agrarian Policy of Ukraine. In 2019, during the presidential and parliamentary elections, he worked at the Mykolaiv regional election headquarters of the "Servant of the People" party and even planned to become a deputy of the Mykolaiv City Council. But the unrest in Poltava broke the budding politician's plans. When Ukraine began to fall apart, he, together with the members of the Regional Council from the "Servant of the People", tried to save the Mykolaiv Oblast from the chaos that engulfed the entire country and was later even elected the head of the Regional Council itself."

POLITICS_tarasenko_DESC: "Heorhii Oleksandrovych Tarasenko (call sign “Zhora”) is the founder and first commander of the “Freikorps” Volunteer Unit and one of the most prominent leaders of the right-wing patriotic movement in Slobozhanshchyna. He was born on December 6, 1996, in Kharkiv. From his teenage years, he stood out for his active civic engagement and nationalist views. While studying at the V. V. Dokuchaev Kharkiv National Agrarian University, Heorhii became a prominent figure among Kharkiv ultras and patriotic organizations. In 2014, when Kharkiv faced the real threat of the proclamation of the pro-Russian quasi-republic “KhNR,” the 17-year-old Tarasenko became an active participant in the Revolution of Dignity and the Kharkiv Euromaidan. He took direct part in street clashes with pro-Russian militants and “titushki,” defending the city’s Ukrainian status. With the start of Russian aggression in Donbas in 2014, Georgiy, despite being a minor, went to the front as a volunteer. He fought as part of various volunteer units in the hottest spots of the ATO, notably participating in the defense of Mariupol and the battles for Shyrokyne and Pisky. The combat experience he gained and his realization that the war was systemic in nature prompted him to create his own unit. In May 2017, Heorhii Tarasenko, together with like-minded individuals, founded the “Freikorp” Volunteer Unit (the name drew inspiration from the German Freikorps and symbolized a volunteer military community) and a public organization of the same name. Under “Zhora’s” leadership, the unit carried out seven combat rotations in the Donbas, holding positions near Donetsk Airport, Pisky, Avdiivka, and along the Mariupol front. Tarasenko built “Freikorp” on the principles of rigorous ideological training, transforming it into an elite military brotherhood."
POLITICS_Petro_Symonenko_DESC: "Petro Mykolayovych Symonenko (born August 1, 1952, in Stalino, now Donetsk) is a former People’s Deputy of Ukraine (1994–2014) and served as the uninterrupted leader of the Communist Party of Ukraine (CPU) from 1993 until its ban. From 1974, he held positions in the Komsomol and the Communist Party in the Donetsk Oblast. By 1991, he had assumed the position of secretary of the Donetsk Regional Committee of the Communist Party of the Soviet Union (CPSU). After the Communist Party was banned in independent Ukraine, he became one of the main organizers of its revival at a congress in Donetsk in 1993, where he was elected First Secretary of the Central Committee of the CPU. Symonenko’s main electoral achievement was advancing to the second round of the 1999 presidential election, where he received 22.2% of the vote, losing to Leonid Kuchma. In the 2000s, his political strategy boiled down to systematic compromises with big business and the Party of Regions in exchange for lobbying for their interests and participating in coalitions, which led to disillusionment among the left-wing electorate and a decline in the party’s approval ratings. Following the events of 2014 and the adoption of laws on decommunization, the activities of the Communist Party of Ukraine were officially suspended."

POLITICS_Sandei_Adelaja_DESC: "Sunday Sunkanimi Adelaja was born in Nigeria and arrived in the USSR in 1986, where he graduated from the journalism department of Belarusian State University in Minsk. In 1993, he moved to Kyiv, where the following year he founded a charismatic church that later became known as the “Embassy of God’s Kingdom for All Nations.” His sermons drew crowds large enough to fill stadiums, and the religious organization gained significant financial and political influence, particularly during the Orange Revolution and Leonid Chernovetskyi’s mayoral tenure. In the late 2000s, Adelaja became the central figure in a high-profile scandal surrounding the “Kings Capital” Ponzi scheme, which caused thousands of his congregants to lose money and property, leading to protracted legal proceedings and accusations of widespread manipulation. After the collapse of the central government in 2019, he fled to Bohuslav, where he used his experience as a manipulator to build a totalitarian theocracy and subjugate the local population under the guise of a “holy war.”"
POLITICS_Gennadiy_Balashov_DESC: "Gennadiy Viktorovich Balashov was born in Dnipropetrovsk. In the early 1990s, he became one of the first private entrepreneurs in independent Ukraine, founding a number of companies and a large network of currency exchange offices. From 1998 to 2002, he served as a People’s Deputy of Ukraine in the third convocation and worked on the Committee on Finance and Banking. He later became known as a radical libertarian ideologue, business coach, and founder of the “5.10” political party. For years, through provocative actions and media platforms, Balashov actively promoted the idea of completely abolishing Ukraine’s existing tax and customs systems, calling for their replacement with just two simple taxes and the elimination of government regulation of business. After the collapse of state institutions in 2019, he moved to Obukhiv, where he put his ideas into practice, declared the district a tax-free offshore zone."
POLITICS_Mykola_Babenko_DESC: "Mykola Andriyovych Babenko was born in Kryvyi Rih and earned a law degree from Taras Shevchenko National University of Kyiv. Before entering politics, he worked in the legal and business sectors. From 2014 to 2015, he served as chairman of the Kyiv Regional Council. In the 2019 parliamentary elections, he was elected a People’s Deputy of Ukraine from the 90th single-member district (the city of Bila Tserkva) as a candidate for the “Bila Tserkva Together” party. In the Verkhovna Rada, he joined the “Trust” deputy group. His political activities as the head of the civic organization and the “Bila Tserkva Together” party have always been based on local patriotism, addressing municipal issues, modernizing the thermal power plant, repairing roads, and attracting investment to Bila Tserkva. Following the collapse of the central government after the 2019 elections, Babenko used his status as a People’s Deputy and leader of the most influential city party to take control of the region into his own hands."
POLITICS_Andriy_Illienko_DESC: "Andriy Yuriyovych Illienko was born in Kyiv to the family of renowned Ukrainian film director Yuriy Illienko and actress Lyudmyla Yefimenko. In 2009, he graduated from the Faculty of Philosophy at Taras Shevchenko National University of Kyiv with a degree in political science, after which he pursued graduate studies there. His political career began while he was still a student: in 2005, he became a member of the All-Ukrainian Union “Svoboda.” Starting in 2010, he headed the party’s Kyiv city organization, actively participated in the events of the Revolution of Dignity, and was one of the leading ideologues of the capital’s right-wing movement. He was elected to the Verkhovna Rada of Ukraine for the 7th (2012–2014) and 8th (2014–2019) convocations, where he actively promoted laws on decommunization and the protection of the Ukrainian language. In the special parliamentary elections in the summer of 2019, he ran for the Verkhovna Rada in Kyiv’s 215th single-member district but was defeated by a candidate from the ruling party. Following the collapse of state institutions in the fall of 2019, Illienko led a militarized far-right wing that established itself in Skvyra."

POLITICS_Vernyk_DESC: "Oleh Ihorovych Vernyk is a Ukrainian labor union leader, lawyer, and left-wing activist (of the Trotskyist persuasion). He has served as chairman of the All-Ukrainian Independent Trade Union “Labor Protection” (VNPS “Labor Protection”) since its founding. Born in 1971, he earned a law degree from the Law Faculty of Taras Shevchenko National University of Kyiv. In 2002, he ran for the Verkhovna Rada of Ukraine as a candidate for the Communist Party of Workers and Peasants but was not elected. Since the early 2010s, he has been actively involved in the independent labor union movement. In 2014, he became one of the founders and chairman of the All-Ukrainian Independent Trade Union “Labor Protection.” Under his leadership, the organization worked to protect the labor rights of workers in the banking, transportation, energy, and other sectors; participated in court cases regarding unlawful dismissals and wage delays; and supported individual strike actions. Vernyk publicly opposed legislative initiatives that restricted trade union rights, collaborated with international trade union organizations, and participated in the work of the “Ukraine–EU” Civil Society Platform. From 2000 to 2003, a group around Vernyk (then in the “Workers’ Organization”) was accused of fraud; they allegedly presented themselves simultaneously as sections of several different international Trotskyist organizations, received funding and support from them, and “duped” their Western comrades. Following an investigation, Vernyk and several of his associates were expelled from the CWI. Until July 2019, he remained one of the prominent figures in Ukraine’s independent labor movement. After the country’s collapse in 2019, Vernyk headed the Energodar workers’ syndicate of the Zaporizhzhia Nuclear and Thermal Power Plants, becoming a key figure in organizing workers’ control over the city’s energy facilities."
POLITICS_Anarchist_Council_DESC: "The Huliaipole Anarchist Council is a self-proclaimed anarchist-style territorial association that emerged in the spring and summer of 2019 amid the collapse of Ukraine’s central government. Its center was the historic Huliaipole region (Zaporizhzhia Oblast), which in the collective memory is associated with the Makhnovist movement of 1918–1921. Its ideological foundation was based on classical anarchist principles—a free federation, the rejection of hierarchical state power, and collective ownership of land and the means of production."
POLITICS_Karmazin_DESC: "Yuriy Anatoliyovych Karmazin was born on September 21, 1957, in the city of Zvenyhorodka, Cherkasy Oblast. He graduated from the Law Faculty of Odesa State University named after I. I. Mechnikov. He worked in the Odesa regional prosecutor’s office, notably as a prosecutor in the Primorsky District of Odesa, and later as a judge of the Odesa Regional Court. He served as a People’s Deputy of Ukraine for several terms, led the Party of Defenders of the Fatherland, and ran for the office of President of Ukraine. In May 2018, at the so-called Great Council of the Cossacks, he was elected hetman of the Cossacks of all Ukraine and presented with the corresponding regalia. After the final collapse of the central government, Karmazin found himself on Khortytsia Island, where local Cossack units proclaimed the New Sich and recognized him as hetman. "
POLITICS_Dzharylhach_Pirates_DESC: "The Pirates of Dzharylgach Island (also known as the Dzharylgach Free People, the Chornomorskaya Bratva, or simply “the Dzharylgackyii”) are a self-proclaimed pirate-led free community that emerged on Dzharylgach Island (Kherson Oblast) following the collapse of Ukraine in 2019. Former fishermen, sailors, smugglers, deserters, local residents from the mainland, and adventurers from all over the south began flocking to Dzharylgach. The island, isolated and difficult to reach, became a natural refuge."

POLITICS_Oleksandr_Vilkul_DESC: "Oleksandr Yuriyovych Vilkul was born on May 24, 1974, in the city of Kryvyi Rih. In 1996, he graduated from Kryvyi Rih Technical University, specializing in open-pit mining operations. His career began in the industrial sector, where he rose from head of the commercial and financial department to general director of the region's leading enterprises—the Southern, Northern, and Central Mining and Processing Plants (GOKs). In 2005, Vilkul Jr. began his active political career by heading the Kryvyi Rih branch of the Party of Regions. He was elected as a People's Deputy of Ukraine in the 5th and 6th convocations. From 2010 to 2012, he served as the Head of the Dnipropetrovsk Regional State Administration, after which he was appointed Deputy Prime Minister of Ukraine in Mykola Azarov's government (2012–2014). Following the change of power in 2014, he returned to the Verkhovna Rada (8th convocation) representing the "Opposition Bloc" party. In the first half of 2019, he ran in the presidential election, finishing eighth in the voting results.\nAfter the collapse of central authority following the 2019 elections, Oleksandr Vilkul focused all his resources on maintaining control over his home region. Amid the degradation of state institutions, he established an autonomous management system in Kryvyi Rih. Relying on the loyalty of the management at major metallurgical and mining enterprises, as well as on the remnants of organized security structures, Vilkul Jr. took charge of the local government, seizing administrative and military control over the territory, while his father, Yuriy Hryhorovych Vilkul, officially continues to serve as the mayor of Kryvyi Rih."
POLITICS_Vitalii_Dudin_DESC: "Vitaliy Mykolayovych Dudin was born on June 25, 1987, in Kyiv. In 2009, he graduated from the Vadym Hetman Kyiv National Economic University; he later earned a Candidate of Legal Sciences degree (2019) and became a recognized expert in labor law. For a long time, he worked as a legal journalist, an expert at the Center for Social and Labor Research, and a lecturer. From 2016, he chaired the council of the left-wing civic organization "Social Movement" (Sotsialnyi Rukh), consistently advocating for the protection of workers' rights, trade union solidarity, and the curbing of big capital's influence.\nFollowing the collapse of central government authorities in the wake of the 2019 events, Vitaliy Dudin moved to the southern part of the Dnipropetrovsk region, where he managed to seize control of the major industrial center of Nikopol. Relying on "Social Movement" cells and independent trade unions from the Nikopol Ferroalloy Plant and local pipe manufacturing enterprises, he led mass workers' self-defense committees that ousted the old city administration from power."
POLITICS_Andriy_Tarasenko_DESC: "Andrii Ivanovych Tarasenko (nom de guerre "Pylypas") was born on November 17, 1982, in the city of Inhulets (now part of Kryvyi Rih), Dnipropetrovsk Oblast. From his youth, he was actively involved in the nationalist movement in Eastern Ukraine, rising from a rank-and-file activist to the First Deputy Head of the All-Ukrainian Organization "Tryzub" (Trident) named after Stepan Bandera. He played an active role in the "Tax Maidan" and "Language Maidan" protests; consequently, in 2011, he was subjected to a politically motivated arrest and spent several months in a pre-trial detention center.\nDuring the Revolution of Dignity, Tarasenko led the Kyiv branch of the newly formed socio-political association "Right Sector." From 2014, he served as the organization's Deputy Leader for political affairs and coordinated the deployment of volunteer units. That same year, he took part directly in combat operations in eastern Ukraine, where he sustained a severe injury that required a long period of rehabilitation. In March 2016, at a national congress, Tarasenko was officially elected head of the "Right Sector" political party and National Liberation Movement. He holds the rank of Lieutenant Colonel in the "Tryzub" organization's reserve. In the first half of 2019, he ran for the Verkhovna Rada, placed fourth on the joint list of nationalist forces. Following the collapse of central authority in the wake of the events of 2019, Andriy Tarasenko returned to his native Dnipropetrovsk region, relocating the core of the paramilitary units and veterans of the DUK "Right Sector" under his command to the eastern part of the region. Through coordinated actions, his detachments took over the administration of the city of Pershotravensk without bloodshed."



