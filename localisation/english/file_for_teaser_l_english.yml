KHA_Radiobeam: "Radiobeam"
KHA_Radiobeam_desc: "Serhiy Zhadan, beside of being a strong poet, has a musical project behind his back, called 'Zhadan and dogs'. The sound of their rock and sorta 'people'-ish lyrics about casual routine and fun in between have attracted a fair amount of fans. This is a possibility to get the people join the cause and share the vision with interested ones."

KHA_Weapons_of_Proletariat: "Weapons of Proletariat"
KHA_Weapons_of_Proletariat_desc: "Waging a battle against the government is not an easy task. With the lack of proper equipment, civilians focus on getting anything, that can be used in the fight - from simple tools and protective gear to makeshift barricades and throwables. While the officials give their orders to armed regiments, wide masses of people are getting ready with everything they have."
