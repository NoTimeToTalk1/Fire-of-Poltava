 # === Demands ===
 terror_demand_1: "§Rimmediately raise pensions to the maximum level§!"
 terror_demand_2: "§Rintroduce generous unemployment benefits§!"
 terror_demand_3: "§Restablish a high minimum wage§!"
 terror_demand_4: "§Rlimit the working day to eight hours§!"
 terror_demand_5: "§Rmake healthcare fully public and free§!"
 terror_demand_6: "§Rintroduce forced gender equality in all spheres of life§!"
 terror_demand_7: "§Rgrant full equal rights to sexual minorities§!"
 terror_demand_8: "§Rgrant cultural autonomy to all ethnic minorities§!"
 terror_demand_9: "§Rcompletely close the borders to migrants§!"
 terror_demand_10: "§Ropen the borders and actively encourage immigration§!"
 terror_demand_11: "§Rintroduce the strictest environmental regulations and fines§!"
 terror_demand_12: "§Rimmediately raise stability and stop the betrayal of Soviet heritage§!"
 terror_demand_13: "§Rdissolve all government bodies and switch to direct democracy§!"
 terror_demand_14: "§Rbuild a new stadium and lower ticket prices§!"
 terror_demand_15: "§Rmake the internet free and lift all blocks§!"
 terror_demand_16: "§Rrestore pensions like in the Soviet Union and raise them to the maximum§!"
 terror_demand_17: "§Rreturn to traditional gender roles and restrict women's rights§!"
 terror_demand_18: "§Rcriminalize sexual minorities and protect the traditional family§!"
 terror_demand_19: "§Roppress ethnic minorities and enforce full assimilation§!"
 terror_demand_20: "§Rremove all environmental regulations to boost industry§!"
 terror_demand_22: "§Rabolish pensions and unemployment benefits§!"
 terror_demand_23: "§Rabolish minimum wage and all working hour limits§!"
 terror_demand_24: "§Rpurge Russian influence and increase war support§!"
 terror_demand_25: "§Rstrengthen central authority and increase government control§!"
 terror_demand_99: "§Rpay a large ransom and release all political prisoners§!"
 terror_demand_fallback: "§Rfulfill their political demands§!"
 
 # Success
 fop_terrorism.2.t: "Successful Anti-Terrorist Operation"
 fop_terrorism.2.d: "Our special forces stormed the building with precision. All terrorists were neutralized and every hostage was rescued alive. The operation is being called a textbook success."
 fop_terrorism.2.a: "Excellent work!"

 # Partial
 fop_terrorism.3.t: "Partial Success"
 fop_terrorism.3.d: "The assault succeeded in eliminating the terrorists, but several hostages were killed in the crossfire. The public is relieved the crisis is over, yet mourning the civilian losses."
 fop_terrorism.3.a: "We did what we could..."

 # Brutal
 fop_terrorism.4.t: "Bloody Fiasco"
 fop_terrorism.4.d: "The storming turned into a massacre. Heavy casualties among both hostages and our forces. The building is a ruin and the political fallout will be severe."
 fop_terrorism.4.a: "This is a disaster..."

 # Full Failure
 fop_terrorism.5.t: "Terrorists Escaped!"
 fop_terrorism.5.d: "The operation was a complete failure. The terrorists managed to escape during the chaos, taking some hostages with them. Our forces were outmaneuvered."
 fop_terrorism.5.a: "How could this happen?!"
 
 fop_storm_tt_very_low: "§ROur intelligence agency is extremely weak.§!\n§RVery high chance of complete failure or a bloody massacre.§!\n§RSuccess is almost impossible.§!"

 fop_storm_tt_low: "§RIntelligence capabilities are poor.§!\n§OHigh chance of failure or heavy casualties.§!\n§YLimited chance of partial success.§!"

 fop_storm_tt_medium: "§YIntelligence agency is average.§!\n§YDecent chance of partial success.§!\n§OStill significant risk of things going wrong.§!"

 fop_storm_tt_high: "§GIntelligence agency is well developed.§!\n§GGood chance of full or partial success.§!\n§YRisk of failure is reduced.§!"

 fop_storm_tt_very_high: "§GElite intelligence apparatus.§!\n§GVery high chance of a clean and successful operation.§!\n§GFailure is unlikely.§!"
 
 # === Desertion === 
 
 fop_desertion.1.t: "Mass Desertion"
 fop_desertion.1.d: "Due to critically low war support, mass desertion has begun.\n\nSoldiers are abandoning their positions and fleeing in large numbers."

 fop_desertion.1.a: "We can do nothing..."
 fop_desertion.1.b: "Stop the deserters by force!"

 fop_desertion_accept_tt: "§RThe division will lose significant strength and organization.\nLarge manpower losses.§!"

 fop_desertion.2.t: "Desertion Stopped"
 fop_desertion.2.d: "Our forces managed to stop most of the deserters. The division remains mostly combat-capable."
 fop_desertion.2.a: "Good work"

 fop_desertion.3.t: "Partial Success"
 fop_desertion.3.d: "We managed to stop some of the deserters, but a significant number still fled."
 fop_desertion.3.a: "Could have been worse..."

 fop_desertion.4.t: "Desertion Out of Control"
 fop_desertion.4.d: "The attempt to stop the deserters failed completely. Even more soldiers abandoned their posts."
 fop_desertion.4.a: "Disaster..."
 
 
 # === Admin crisis === 
 fop_admin_crisis.1.t: "Administrative Crisis"
 fop_admin_crisis.1.d: "The government is completely out of political power. The administrative apparatus is grinding to a halt.\n\nA group of influential figures of [GetOligarchGroup] has approached us with an offer of 'help'."

 fop_admin_crisis.1.a: "Tighten the belts. Cancel all social benefits."
 fop_admin_crisis.1.b: "Make a deal with [GetOligarchGroup]"
 fop_admin_crisis.1.c: "We will survive somehow..."


