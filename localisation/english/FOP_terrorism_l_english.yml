l_english:

 # === Event ===
 fop_terrorism.1.t: "Terrorist Attack in [terror_state.GetName]"
 fop_terrorism.1.d: "Today at [GetTerrorHour]:00 in the city of [terror_state.GetCapitalVictoryPointName], radical extremists from the organization of [GetTerrorGroup] seized [GetTerrorPlace] and took civilians hostage.\n\nThey demand: [GetTerrorDemand].\n\nThe authorities must decide meet their demands or launch a rescue operation."

 fop_terrorism.1.a: "Meet the terrorists' demands"
 fop_terrorism.1.b: "Storm the building and free the hostages"
 
 fop_terrorism_storm_start_tt: "§GThe operation will start!§!"

 fop_terrorism_surrender_tt: "§YDemands have been met.§!\nStability has slightly increased, but the political cost is high..."
 fop_terrorism_storm_success_tt: "§GThe operation was a success!§!\nAll hostages are alive, the terrorists have been neutralized..."
 fop_terrorism_storm_partial_tt: "§OThe operation was only partially successful.§!\nSome hostages died during the assault..."
 fop_terrorism_storm_fail_tt: "§RCatastrophe!§!\nThe assault failed. Heavy casualties among civilians and security forces..."

