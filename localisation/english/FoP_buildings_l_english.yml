 hospital_building: "Hospital"
 hospital_building_desc: "Medical facilities that improve the health and recovery of both civilians and soldiers, reducing losses and strengthening national stability."

 farm_building: "Farm"
 farm_building_desc: "Agricultural complexes that support population growth and provide a stable foundation for industrial and economic development."

 civil_education_centre: "Civil Education Centre"
 civil_education_centre_desc: "Institutions focused on educating the civilian population, promoting scientific progress, political awareness, and resistance to foreign subversion."

 religious_building: "Religious Building"
 religious_building_desc: "Places of worship that strengthen social cohesion, increase compliance, and reinforce ideological unity within the population."

 situation_centre: "Situation Centre"
 situation_centre_desc: "A centralized command and control hub used for intelligence coordination, military planning, and rapid response to emerging threats."

 civilian_resting_place: "Civilian Resting Place"
 civilian_resting_place_desc: "Public leisure and recreation areas that improve civilian morale and cooperation with the authorities."

 boot_camp: "Boot Camp"
 boot_camp_desc: "Military training facilities designed to rapidly prepare recruits and improve overall army experience gain."

 recruiting_center: "Recruiting Center"
 recruiting_center_desc: "Administrative centers dedicated to expanding conscription and accelerating the recruitment of new manpower."

 labour_camp: "Labour Camp"
 labour_camp_desc: "Forced labor facilities that boost industrial output and manpower at the cost of higher resistance, unrest, and international reputation."
