 infantry_weapons_improvements1_desc: "Optics, improved ammunition, ergonomic furniture and more dependable accessories bring existing weapons closer to contemporary standards. Better-equipped riflemen can engage targets more accurately and maintain their effectiveness under fire."
 infantry_weapons2: "Modern Service Rifles"
 infantry_weapons2_desc: "A new generation of service rifles and squad weapons emphasizes modularity, improved ergonomics and compatibility with modern sights. These weapons provide infantry units with a more versatile and dependable foundation."
 infantry_weapons_improvements2: "Improved Infantry Weapon Systems"
 infantry_weapons_improvements2_desc: "Further refinements to barrels, ammunition, optics and weapon accessories increase the effectiveness of ordinary infantry and motorized formations. Standardized upgrades make it easier to maintain performance across the force."
 infantry_weapons3: "Advanced Infantry Small Arms"
 infantry_weapons3_desc: "Modernized rifles, compact automatic weapons and improved squad-level firearms reflect the lessons of recent conflicts. Better handling and more capable sighting systems help infantry deliver accurate fire in a wider range of combat situations."
 infantry_weapons_improvements3: "Integrated Infantry Weapon Upgrades"
 infantry_weapons_improvements3_desc: "Improved fire-control accessories, suppressors, ammunition and weapon ergonomics make the infantry's standard arsenal more effective. These incremental improvements strengthen both dismounted troops and motorized units."
 infantry_weapons_improvements4: "Next-Generation Small Arms"
 infantry_weapons_improvements4_desc: "The latest generation of infantry weapon improvements focuses on modular platforms, advanced optics and more effective ammunition. A carefully integrated weapon system gives every squad greater flexibility and combat efficiency."
 infantry_weapons4: "Future Infantry Weapons"
 infantry_weapons4_desc: "Emerging small-arms designs combine advanced materials, improved fire control and adaptable weapon configurations. Their adoption marks the next step in equipping infantry for increasingly demanding battlefields."
 support_weapons: "Infantry Support Weapons"
 support_weapons_desc: "Machine guns and other crew-served weapons provide the sustained fire needed to support rifle squads. Mortars and anti-armour support systems give infantry formations the means to engage threats beyond the capabilities of individual rifles."
 support_weapons1: "Modern Squad Support Weapons"
 support_weapons1_desc: "Updated machine guns, grenade launchers and support systems improve the firepower available to infantry platoons. Better distribution of supporting weapons allows squads to hold ground and maneuver with greater confidence."
 support_weapons2: "Improved Fire Support Equipment"
 support_weapons2_desc: "More reliable support weapons and better ammunition increase the ability of infantry units to suppress enemy positions. Improved deployment and coordination help sustain defensive fire while supporting local counterattacks."
 support_weapons3: "Advanced Infantry Support Systems"
 support_weapons3_desc: "Modernized machine guns, automatic grenade launchers and portable support equipment give infantry units greater tactical flexibility. Improved firepower helps pin down enemy forces and protect advancing troops."
 support_weapons4: "Networked Support Weapons"
 support_weapons4_desc: "Digital sights, improved fire-control equipment and more capable ammunition help support teams engage targets with greater precision. Better integration with squad communications makes supporting fire more responsive."
 support_weapons5: "Next-Generation Support Weapons"
 support_weapons5_desc: "Lightweight materials and advanced targeting equipment make crew-served weapons easier to deploy without sacrificing effectiveness. Infantry formations gain a more adaptable and sustainable base of supporting fire."
 infantry_at1: "Portable Anti-Tank Weapons"
 infantry_at1_desc: "Infantry units receive dedicated anti-tank weapons capable of threatening armored vehicles at practical battlefield ranges. Their introduction gives ordinary formations an answer to enemy armor without relying entirely on tank or artillery support."
 infantry_at_improvements1: "Recoilless Anti-Tank Systems"
 infantry_at_improvements1_desc: "Recoilless weapons provide infantry with a portable means of delivering heavier anti-armour fire. Improved launchers and ammunition increase the ability of anti-tank teams to disable armored targets."
 infantry_at2: "Modern Anti-Tank Guided Missiles"
 infantry_at2_desc: "Guided missiles allow infantry teams to engage armored vehicles from greater distances and with improved accuracy. New missile systems and vehicle-mounted launchers expand the anti-tank capabilities available to ground forces."
 infantry_at_improvements2: "Improved Recoilless Weapons"
 infantry_at_improvements2_desc: "Newer recoilless systems offer better ammunition and improved handling. Their increased effectiveness strengthens dedicated anti-tank units and gives them more options against fortified positions and armored vehicles."
 infantry_at3: "Advanced Anti-Tank Missiles"
 infantry_at3_desc: "More capable guided missiles improve range, penetration and the ability to defeat modern armor. Infantry and mechanized formations can now rely on more effective anti-tank systems in contested environments."
 infantry_at_improvements3: "Enhanced Recoilless Systems"
 infantry_at_improvements3_desc: "Refined launchers, improved sights and more effective warheads increase the performance of infantry anti-tank teams. These upgrades help older weapon concepts remain useful on a modern battlefield."
 infantry_at4: "Next-Generation Anti-Tank Weapons"
 infantry_at4_desc: "The newest generation of portable and vehicle-launched anti-tank weapons combines advanced guidance with improved warheads. These systems are designed to challenge heavily protected vehicles and adapt to evolving defensive measures."
 infantry_aa1: "Infantry Anti-Aircraft Weapons"
 infantry_aa1_desc: "Portable anti-aircraft weapons give ground formations a limited ability to contest enemy aircraft operating overhead. Even a modest threat forces hostile pilots to operate more cautiously and provides troops with a measure of protection."
 infantry_aa_improvements1: "Improved Air Defence Training"
 infantry_aa_improvements1_desc: "Better observation, target recognition and firing procedures make infantry anti-aircraft teams more effective. Coordinated engagement practices improve the ability of ground troops to threaten low-flying aircraft."
 infantry_aa2: "Modern Man-Portable Air Defence"
 infantry_aa2_desc: "New man-portable air-defence systems improve the reach and reliability of infantry air defence. More capable missiles allow ground units to engage a broader range of aircraft and helicopters."
 infantry_aa_improvements2: "Integrated Short-Range Air Defence"
 infantry_aa_improvements2_desc: "Improved sensors, communications and engagement procedures help infantry formations coordinate their anti-aircraft fire. Better integration makes it harder for hostile aircraft to operate freely over the battlefield."
 infantry_aa3: "Advanced Man-Portable Air Defence"
 infantry_aa3_desc: "Modern seekers and improved missile performance increase the effectiveness of portable air-defence teams. These systems provide infantry with a more credible threat against aircraft and helicopters at low and medium altitudes."
 infantry_aa_improvements3: "Networked Air Defence Teams"
 infantry_aa_improvements3_desc: "Digital communications and improved target acquisition allow anti-aircraft teams to share information and react faster. Coordinated engagements strengthen the protection of dispersed infantry formations."
 infantry_aa4: "Next-Generation Short-Range Air Defence"
 infantry_aa4_desc: "Advanced portable missiles and improved targeting systems give ground troops a stronger defence against modern aerial threats. Better coordination and more capable weapons make low-altitude operations increasingly dangerous for the enemy."
 night_vision: "Night Operations Training"
 night_vision_desc: "Basic night-fighting equipment and dedicated training allow troops to operate more confidently in darkness. Improved discipline and familiarity with low-light conditions help preserve unit cohesion and combat readiness."
 infantry_acclimatization: "Environmental Adaptation"
 infantry_acclimatization_desc: "Specialized training and suitable field equipment prepare troops for extreme heat, severe cold and difficult weather. Better acclimatization reduces the physical toll of operating in harsh environments."
 night_vision1: "Generation II Night Vision"
 night_vision1_desc: "Improved image intensifiers and thermal observation devices make it easier to detect and engage targets after dark. Night operations become more effective as troops gain a clearer picture of their surroundings."
 night_vision2: "Digital Night-Fighting Systems"
 night_vision2_desc: "Modern thermal sights, digital night-vision devices and improved observation equipment extend the army's ability to fight in darkness. Reconnaissance and special forces benefit from better awareness and more reliable target identification."
 night_vision3: "Integrated Night Operations"
 night_vision3_desc: "Advanced night-vision equipment is integrated into infantry weapons and unit procedures. Thermal imaging, digital displays and coordinated reconnaissance allow formations to maintain pressure on the enemy around the clock."
 army_uniform: "Modern Field Uniforms"
 army_uniform_desc: "Standardized combat uniforms improve comfort, durability and the practical organization of personal equipment. A consistent clothing and load-bearing system helps troops move and fight more efficiently."
 body_armor1: "Kevlar Body Armour"
 body_armor1_desc: "The introduction of modern ballistic vests gives soldiers improved protection against fragments and small-arms fire. Better personal protection increases survivability and helps maintain morale under combat conditions."
 body_armor2: "Ceramic Ballistic Plates"
 body_armor2_desc: "Ceramic plates added to modern body armour provide improved protection against rifle-calibre threats. Better-fitting carriers and modular protection allow soldiers to balance survivability with mobility."
 body_armor3: "Improved Tactical Body Armour"
 body_armor3_desc: "Updated plate carriers and improved ballistic materials provide more reliable protection while accommodating essential combat equipment. Better load distribution and modular design make prolonged operations less demanding."
 body_armor4: "Interceptor Multi-Threat Body Armour"
 body_armor4_desc: "The latest body-armour systems combine advanced ballistic materials with modular protection against several battlefield threats. Improved coverage and ergonomic design help protect soldiers without excessively restricting movement."
 camouflage1: "Digital Camouflage Patterns"
 camouflage1_desc: "Modern camouflage patterns are designed to break up a soldier's outline across different terrain and viewing distances. Improved concealment reduces exposure to enemy observation and makes air attacks less effective."
 camouflage2: "Adaptive Camouflage Equipment"
 camouflage2_desc: "Updated camouflage clothing, covers and field concealment techniques help troops blend into varied surroundings. Better concealment makes it harder for enemy aircraft and ground units to identify targets."
 camouflage3: "Multispectral Camouflage"
 camouflage3_desc: "Modern concealment materials reduce a unit's visibility across more than the visible-light spectrum. Improved thermal and visual signature management helps troops survive in an environment increasingly dominated by sensors."
 camouflage4: "Advanced Signature Management"
 camouflage4_desc: "Integrated camouflage systems combine multispectral materials, disciplined fieldcraft and improved concealment procedures. Reducing the signatures of personnel and equipment makes detection and targeting more difficult."
 command_and_control: "Modern Command and Control"
 command_and_control_desc: "Reliable communications and clear command procedures connect headquarters with units in the field. A common command structure improves coordination, speeds up decision-making and helps the armed forces act as a unified force."
 command_and_control1: "Digital Command Networks"
 command_and_control1_desc: "Digital communications and improved staff procedures allow commanders to distribute orders and receive reports more quickly. Better coordination improves operational tempo and helps units recover organization between engagements."
 command_and_control2: "Integrated Battlefield Management"
 command_and_control2_desc: "Shared operational information links land, air and naval headquarters with formations in the field. Improved command tools help commanders coordinate forces and allocate resources more effectively."
 command_and_control3: "Network-Centric Operations"
 command_and_control3_desc: "Secure data networks and common operational systems provide commanders with a more complete picture of the battlefield. Faster information exchange improves coordination between services and supports more responsive command decisions."
 command_and_control4: "Joint Digital Battlespace"
 command_and_control4_desc: "A highly integrated command network connects sensors, headquarters and combat units across every service. Automated information exchange and mature joint procedures improve the army's ability to coordinate complex operations."
 combat_drone1: "Tactical Combat Drones"
 combat_drone1_desc: "Small unmanned aircraft provide infantry units with local reconnaissance and limited direct battlefield support. Their use improves situational awareness and gives squads another way to observe enemy positions."
 basic_train: "Standard Railway Rolling Stock"
 basic_train_desc: "The army adopts a standardized fleet of locomotives and freight cars for military transport. Reliable railway equipment is essential for moving personnel, supplies and heavy equipment across the country."
 wartime_train: "Wartime Railway Operations"
 wartime_train_desc: "Military railway services are reorganized to cope with mobilization, damaged infrastructure and increased logistical demand. More robust rolling stock and wartime procedures help keep supplies moving during conflict."
 armored_train: "Armoured Trains"
 armored_train_desc: "Armoured locomotives and protected railway cars provide security for important rail lines and transport convoys. Though vulnerable to modern threats, these trains can still support rear-area security and operations along key routes."
 paratroopers: "Airborne and Amphibious Training"
 paratroopers_desc: "Specialized training establishes dedicated airborne, mountain and marine formations. These troops are prepared to operate in difficult environments and conduct missions that conventional infantry cannot easily perform."
 afu_special_forces: "Special Operations Forces"
 afu_special_forces_desc: "The establishment of dedicated special operations units provides the armed forces with highly trained personnel for reconnaissance, direct action and other specialized missions. Rigorous selection and training improve the effectiveness of these elite formations."

 mortar: "Early Mortars"
 mortar_desc: "The first generation of infantry mortars provides indirect fire support against enemy positions. Though limited in range and accuracy, these weapons give infantry units a means of striking targets beyond direct line of sight."
 mortar1: "Modern Mortars"
 mortar1_desc: "Modern mortar designs improve reliability, mobility and ease of operation. Updated sights and ammunition allow crews to deliver more accurate indirect fire in support of advancing infantry."
 mortar2: "Advanced Mortars"
 mortar2_desc: "Improved barrel construction, ammunition and fire-control procedures increase the range and effectiveness of mortar units. These systems provide responsive fire support against entrenched and dispersed targets."
 mortar3: "Precision Mortar Systems"
 mortar3_desc: "Modern fire-control equipment and improved ammunition shorten the time between target acquisition and impact. Mortar crews can respond faster and deliver more consistent fire under changing battlefield conditions."
 mortar4: "Next-Generation Mortars"
 mortar4_desc: "The latest mortar systems combine advanced materials, digital fire control and improved ammunition. Greater responsiveness and precision make them a dependable source of close indirect fire support."
 howitzer: "Early Field Artillery"
 howitzer_desc: "The first generation of field artillery establishes the foundation for indirect fire support. Towed guns and howitzers provide infantry formations with the firepower needed to suppress enemy positions and destroy fortifications."
 howitzer1: "Modern Towed Artillery"
 howitzer1_desc: "Modernized field guns benefit from improved construction, sights and ammunition. These changes increase reliability and make artillery support more effective across a wider range of battlefield conditions."
 sp_artillery1: "Early Self-Propelled Artillery"
 sp_artillery1_desc: "Mounting artillery on a tracked or wheeled chassis gives gun crews greater mobility and protection. Self-propelled systems can keep pace with mechanized formations and reposition more quickly than traditional towed guns."
 artillery_upgrade1: "Improved Artillery Procedures"
 artillery_upgrade1_desc: "Better fire direction, crew training and coordination improve the effectiveness of field artillery. Standardized procedures help batteries deliver more consistent fire in support of ground operations."
 howitzer2: "Advanced Field Artillery"
 howitzer2_desc: "New gun designs, improved propellants and more capable ammunition extend the reach and effectiveness of field artillery. These systems provide reliable fire support against increasingly dispersed and fortified targets."
 sp_artillery2: "Advanced Self-Propelled Artillery"
 sp_artillery2_desc: "Improved chassis, gun systems and onboard equipment increase the mobility and operational reliability of self-propelled artillery. These vehicles are better suited to sustained operations alongside modern ground forces."
 artillery_upgrade2: "Artillery Fire-Control Improvements"
 artillery_upgrade2_desc: "Improved observation, communications and fire-direction systems help artillery units coordinate their fire more effectively. Better battlefield information allows batteries to respond to changing targets with greater efficiency."
 howitzer3: "Modern Precision Howitzers"
 howitzer3_desc: "Modern howitzers combine extended range with improved accuracy and faster deployment. Updated fire-control systems and ammunition make it possible to engage targets more effectively while reducing time spent exposed to counter-battery fire."
 sp_artillery3: "Modern Self-Propelled Artillery"
 sp_artillery3_desc: "Modern self-propelled guns integrate advanced navigation, communications and fire-control equipment. Their ability to move, fire and relocate rapidly makes them valuable in highly mobile and contested battlespaces."
 artillery_upgrade3: "Networked Artillery Coordination"
 artillery_upgrade3_desc: "Digital battlefield networks connect observers, command posts and artillery batteries. Faster target data exchange improves responsiveness and allows artillery formations to coordinate concentrated fire more effectively."
 howitzer4: "Next-Generation Field Artillery"
 howitzer4_desc: "The newest field artillery systems employ advanced materials, automated loading and digital fire control. Greater range, precision and operational flexibility define the next generation of conventional gun artillery."
 sp_artillery4: "Next-Generation Self-Propelled Artillery"
 sp_artillery4_desc: "Highly automated gun systems and advanced vehicle platforms improve the speed and survivability of self-propelled artillery. Integrated sensors and digital networks allow these units to operate as part of a connected force."
 anti_air1: "Modern Anti-Aircraft Guns"
 anti_air1_desc: "Modern anti-aircraft artillery provides ground formations and key installations with protection against hostile aircraft. Improved sights and fire-control equipment make gun batteries more effective against low-flying threats."
 anti_air_upgrade1: "Improved Anti-Aircraft Fire Control"
 anti_air_upgrade1_desc: "Better ranging equipment, target tracking and crew coordination improve the accuracy of anti-aircraft batteries. These improvements increase their ability to engage aircraft and support ground forces."
 anti_air2: "Advanced Anti-Aircraft Artillery"
 anti_air2_desc: "New gun systems and improved ammunition increase the effectiveness of ground-based air defence. These weapons provide stronger protection against aircraft operating at low and medium altitudes."
 anti_air_upgrade2: "Integrated Anti-Aircraft Defence"
 anti_air_upgrade2_desc: "Improved communications and coordinated fire-control procedures allow anti-aircraft batteries to operate more effectively together. Shared target information helps units respond to incoming aircraft with greater speed."
 anti_air3: "Modern Anti-Aircraft Systems"
 anti_air3_desc: "Modern anti-aircraft guns incorporate improved sensors, tracking equipment and more capable ammunition. These systems strengthen local air defence and provide additional fire support against ground targets."
 anti_air_upgrade3: "Advanced Air-Defence Coordination"
 anti_air_upgrade3_desc: "Digital tracking and improved command systems allow anti-aircraft units to coordinate engagements across a wider area. Faster information exchange improves target acquisition and the overall effectiveness of air defence formations."
 anti_air4: "Next-Generation Anti-Aircraft Artillery"
 anti_air4_desc: "The latest anti-aircraft artillery combines advanced tracking, automated fire control and improved weapon systems. These capabilities provide a more responsive defence against modern aerial threats."
 rocket_artillery: "Early Rocket Artillery"
 rocket_artillery_desc: "The earliest rocket artillery concepts offer a way to deliver large volumes of explosives over an area. Their limited accuracy is offset by the disruptive effect of concentrated salvo fire."
 rocket_artillery1: "Modern Rocket Artillery"
 rocket_artillery1_desc: "Modern multiple-launch rocket systems improve range, mobility and salvo coordination. They allow ground forces to strike concentrations, logistics areas and fortified positions with a large volume of fire."
 rocket_artillery_upgrade1: "Improved Rocket Artillery Tactics"
 rocket_artillery_upgrade1_desc: "Better launch procedures, targeting methods and ammunition handling increase the effectiveness of rocket artillery. Improved coordination allows batteries to deliver heavier and more reliable salvos."
 rocket_artillery2: "Advanced Multiple-Launch Rocket Systems"
 rocket_artillery2_desc: "New launchers and improved rockets extend the reach and flexibility of rocket artillery. Greater mobility and more capable ammunition allow units to engage targets deeper behind enemy lines."
 rocket_artillery_upgrade2: "Rocket Artillery Fire Coordination"
 rocket_artillery_upgrade2_desc: "Improved reconnaissance and fire-direction procedures help rocket artillery units acquire targets and coordinate their salvos. Better integration with ground forces increases the impact of area bombardment."
 rocket_artillery3: "Modern Rocket Artillery Systems"
 rocket_artillery3_desc: "Modern rocket artillery uses improved launch platforms, navigation and guidance technologies. These advances increase the effectiveness of long-range strikes and improve the ability of batteries to relocate after firing."
 rocket_artillery_upgrade3: "Networked Rocket Artillery"
 rocket_artillery_upgrade3_desc: "Digital communications and integrated targeting systems connect rocket artillery with reconnaissance and command networks. Faster target updates improve salvo timing and the effectiveness of coordinated strikes."
 rocket_artillery4: "Next-Generation Rocket Artillery"
 rocket_artillery4_desc: "The newest rocket artillery systems combine extended range, improved guidance and highly mobile launch platforms. They provide ground forces with responsive long-range fire support against high-value targets."