l_english:
 communism: "Communism"
 communism_desc: "Communist"
 communism_noun: "Communism"
 marxism_leninism: "Marxism-Leninism"
 marxism_leninism_desc: "Marxism-Leninism is an extreme left-wing ideology that emerged in the 20th century as a Russian version of Marxism modified by Lenin and later by Stalin. With signs of totalitarianism, it became the state doctrine of the USSR and its ruling Communist Party. After World War II, most of the world's communist movements adopted doctorates of Marxism-Leninism. The main goal for its proponents is to change the world capitalist order through a revolution of the 'working class', but to fulfil its historical mission, it needs a 'vanguard' - a 'new type' Communist Party characterized by rigid centralism."
 national_communism: "National Communism"
 national_communism_desc: "National Communism refers to the adaptation of Marxist-Leninist doctrine to specific national conditions and historical traditions. Its proponents reject strict subordination to a foreign communist center or pure proletarian internationalism, arguing that the construction of socialism must incorporate national identity, local cultural institutions, and sovereign state interests."
 market_socialism: "Market Socialism"
 market_socialism_desc: "Market Socialism is an economic and political model that combines public or cooperative ownership of major industries with market mechanisms for resource allocation. Within Marxist-Leninist states, it typically emerges through economic reforms that introduce price signals, private small-scale enterprise, and foreign investment to increase productivity while retaining the political monopoly of the ruling party."
 
 socialism: "Socialism"
 socialism_desc: "Socialist"
 socialism_noun: "Socialism"
 democratic_socialism: "Democratic Socialism"
 democratic_socialism_desc: "Democratic Socialism is political ideology that supports the establishment of a democratically run and decentralized form of socialist economy. Modern democratic socialists vary widely in their views of how a proper socialist economy should function, but all share the goal of abolishing capitalism rather than improving it through state regulation (as preferred by social democrats)."
 anarchist_communism: "Anarcho-Communism"
 anarchist_communism_desc: "Anarcho-Communism is a political philosophy and anarchist school of thought which advocates the abolition of the state, capitalism, wage labor, social hierarchies, and private property (while retaining respect for personal property, along with collectively-owned items, goods, and services) in favor of common ownership of the means of production and direct democracy as well as a horizontal network of workers' councils."
 anarchist_syndicalism: "Anarcho-Syndicalism"
 anarchist_syndicalism_desc: "Anarcho-Syndicalism is a branch of anarchism that views revolutionary industrial unionism as the primary vehicle for working-class liberation. It advocates direct action—such as general strikes and workplace occupations—to abolish both capitalism and the state, replacing them with a decentralized federation of worker-managed syndicates."
 christian_socialism: "Christian Socialism"
 christian_socialism_desc: "Christian Socialism is a political and theological tradition that critiques capitalism (specifically greed, usury, and extreme inequality) as incompatible with Christian teachings. It advocates for economic egalitarianism, cooperative ownership, and social welfare grounded in the moral principles of the New Testament."
 agrarian_socialism: "Agrarian Socialism"
 agrarian_socialism_desc: "Agrarian Socialism is a socio-economic ideology centered on the collective or cooperative ownership of agricultural land and rural means of production. In contrast to urban industrial socialism, it emphasizes the peasantry and rural laborers as the primary revolutionary class, advocating for the redistribution of large estates into self-governing village communes."
 
 social_democracy: "Social Democracy"
 social_democracy_desc: "Social Democratic"
 social_democracy_noun: "Social Democracy"
 reformism: "Reformism" #Modern Social Democracy
 reformism_desc: "Reformism is a political stance that has largely abandoned the orthodox Marxist goal of abolishing capitalism. Instead, it operates on the belief that the capitalist system can be tamed and made survivable for the working class through a strong welfare state, progressive taxation, and rigorous state regulation. It seeks to humanize and manage the free market rather than replace it."
 social_conservatism: "Social Conservatism"
 social_conservatism_desc: "Social Conservatism is the belief that society is built upon a fragile network of relationships which need to be upheld through duty, traditional values and established institutions. In Ukrainian politics, Social Conservatism is most often combined with Russophilia."
 left_agrarianism: "Left Agrarianism"
 left_agrarianism_desc: "Left Agrarianism takes the idea of a social and political philosophy that advocates for rural development, a rural agricultural lifestyle, family farming, widespread property ownership, and political decentralization, while mixing it with general left ideas, such as equality and left economy."
 left_populism: "Left Populism"
 left_populism_desc: "Left Populism is a political ideology that combines left-wing politics with populist rhetoric and themes. Its rhetoric often consists of anti-elitism, opposition to the Establishment, and speaking for the 'common people'."
 
 progressivism: "Progressivism"
 progressivism_desc: "Progressivist"
 progressivism_noun: "Progressivism"
 social_liberalism: "Social Liberalism"
 social_liberalism_desc: "Social Liberalism is a branch of liberalism that argues individual liberty requires a baseline of social and economic security. Unlike classical liberalism, which favors laissez-faire economics, social liberalism supports a regulated market economy, public education, healthcare, and state intervention to correct market failures and expand civil rights."
 progressive_liberalism: "Progressive Liberalism"
 progressive_liberalism_desc: "Progressive Liberalism expands the classical liberal focus on individual liberty to include structural social justice. It argues that true freedom is impossible if individuals are oppressed by systemic discrimination or poverty. As such, it advocates for an active state that intervenes to protect marginalized groups, enforce civil rights, and provide a strong social safety net, blending free-market economics with progressive social values."
 ecopolitics: "Ecopolitics"
 ecopolitics_desc: "Ecopolitics, or Green politics, is an ideology that prioritizes environmental sustainability and ecological preservation in state policy. It critiques industrial models of unrestrained economic growth, advocating instead for decarbonization, renewable energy, environmental regulation, and participatory democracy."
 
 centrism: "Centrism"
 centrism_desc: "Centrist"
 centrism_noun: "Centrism"
 pragmatism: "Pragmatism"
 pragmatism_desc: "Pragmatism in the political sphere operates as strict Realpolitik. Stripped of ideological dogmas, it views statecraft purely as a matter of efficiency, stability, and problem-solving. Pragmatic governments often govern through technocracy, adopting whatever economic or social policies are most useful for the survival and strengthening of the state at any given moment, regardless of traditional left-right political alignments.
 big_tent: "Big Tent"
 big_tent_desc: "Big Tent, or catch-all politics, describes political parties or coalitions that aggregate diverse ideological factions under a single organizational structure. Rather than enforcing strict doctrinal uniformity, such movements unite disparate interest groups around broad consensus goals, electoral viability, or a single charismatic leadership."
 anomalycentrism: "Anomalycentrism"
 anomalycentrism_desc: "Anomalycentrism is an idea, which was born on the lands of Chornobyl Exclusion Zone. Since some turn of events, the Zone became a shelter for various groups of people, who have different views and beliefs. Anomalycentrism protects that form of society, offering the world a new type of society, involved at limited piece of land and harbouring variety of politics."
 
 liberalism: "Liberalism"
 liberalism_desc: "Liberal"
 liberalism_noun: "Liberalism"
 neoliberalism: "Neoliberalism"
 neoliberalism_desc: "Neoliberalism is contemporarily used to refer to market-oriented reform policies such as "eliminating price controls, deregulating capital markets, lowering trade barriers" and reducing, especially through privatization and austerity, state influence in the economy. Neoliberalism is distinct from classical liberalism insofar as it does not advocate laissez-faire economic policy but instead is highly constructivist and advocates a strong state to bring about market-like reforms in every aspect of society."
 conservative_liberalism: "Conservative Liberalism"
 conservative_liberalism_desc: "Conservative Liberalism is a variant of liberalism combining liberal values and policies with conservative stances, or simply representing the right wing of the liberal movement."
 classical_liberalism: "Classical Liberalism"
 classical_liberalism_desc: "Classical Liberalism is a political tradition and a branch of liberalism that advocates free market and laissez-faire economics and civil liberties under the rule of law, with special emphasis on individual autonomy, limited government, economic freedom, political freedom and freedom of speech."
 libertarianism: "Libertarianism"
 libertarianism_desc: "Libertarianism is a political philosophy, that upholds liberty as a core principle. Libertarians seek to maximize autonomy and political freedom, emphasizing free association, freedom of choice, individualism, and voluntary association."
 
 conservatism: "Conservatism"
 conservatism_desc: "Conservative"
 conservatism_noun: "Conservatism"
 liberal_conservatism: "Liberal Conservatism"
 liberal_conservatism_desc: "Liberal Conservatism is a political ideology combining conservative policies with liberal stances, especially on economic issues but also on social and ethical matters, representing a brand of political conservatism strongly influenced by liberalism."
 christian_democracy: "Christian Democracy"
 christian_democracy_desc: "Christian Democracy is a political movement that has a close association with Roman Catholicism and its philosophy of social and economic justice. It incorporates both traditional church and family values and progressive values such as social welfare."
 islamic_democracy: "Islamic Democracy"
 islamic_democracy_desc: "Islamic Democracy is a movement, that represents the implementation of islamic practices and philosophy under the rule of democratic institution, such as elected government, freedom of speech and secularism."
 progressive_conservatism: "Progressive Conservatism"
 progressive_conservatism_desc: "Progressive Conservatism is a political ideology that aims to modernize traditional conservative principles by incorporating a strong commitment to social reform and equality. It seeks to address contemporary societal issues while maintaining core conservative values."
 paternal_conservatism: "Paternalistic Conservatism"
 paternal_conservatism_desc: "Paternalistic Conservatism operates on the belief that the state must act as a strict but providing father figure. It combines state-heavy economic intervention and expansive social welfare with traditionalist social values. Historically designed to prevent working-class revolutions, it promises the masses stability, pensions, and physical safety in exchange for absolute respect for authority and social order."
 agrarianism: "Agrarianism"
 agrarianism_desc: "Agrarianism is a political and social philosophy that has promoted subsistence agriculture, smallholdings, egalitarianism, with agrarian political parties normally supporting the rights and sustainability of small farmers and agricultural workers against the wealthy in society."
 solidarism: "Solidarism"
 solidarism_desc: "Solidarism is an ideology of class collaboration. Rejecting both the Marxist idea of class struggle and the liberal concept of extreme individualism, it views the nation as a single, organic body. It argues that workers, owners, and the state must cooperate for the greater good of the nation, often supported by Christian democratic social teachings, trade unions, and state mediation to ensure economic justice."
 
 national_democracy: "National Democracy"
 national_democracy_desc: "National Democratic"
 national_democracy_noun: "National Democracy"
 national_liberalism: "National Liberalism"
 national_liberalism_desc: "National Liberalism is a variant of liberalism, combining liberal policies and issues with elements of nationalism."
 national_conservatism: "National Conservatism"
 national_conservatism_desc: "National Conservatism is a nationalist variant of conservatism that concentrates on upholding national and cultural identity. National conservatives usually combine nationalism with conservative stances promoting traditional cultural values, family values, and opposition to immigration. In Europe, most National Conservatist parties embrace some form of Euroscepticism."
 national_populism: "National Populism"
 national_populism_desc: "National Populism is a political ideology that combines right-wing politics with populist rhetoric and themes. Its rhetoric employs anti-elitist sentiments, opposition to the Establishment, and speaking to or for the common people."
 
 traditionalism: "Traditionalism"
 traditionalism_desc: "Traditionalist"
 traditionalism_noun: "Traditionalism"
 traditional_conservatism: "Traditional Conservatism"
 traditional_conservatism_desc: "Traditionalist Conservatism is a political and social philosophy that emphasizes the importance of transcendent moral principles, manifested through certain posited natural laws to which it is claimed society should adhere."
 christian_fundamentalism: "Christian Fundamentalism"
 christian_fundamentalism_desc: "Christian Fundamentalism is a religious movement emphasizing biblical literalism. Fundamentalists are almost always described as upholding beliefs in biblical infallibility and biblical inerrancy, in keeping with traditional Christian doctrines concerning biblical interpretation, the role of Jesus in the Bible, and the role of the church in society."
 islamism: "Islamism"
 islamism_desc: "Islamism is a range of religious and political ideological movements that believe that Islam should influence political systems. Its proponents believe Islam is innately political, and that Islam as a political system is superior to communism, liberal democracy, capitalism, and other alternatives in achieving a just, successful society.  Islamists support family values, sharia, the reformation of interest-based finance, and the broad Quranic command of 'enjoining goodness and forbidding evil.'"
 monarchism: "Monarchism"
 monarchism_desc: "Monarchism is a socio-political movement whose goal is the establishment, preservation or restoration of the monarchical rule in a state."
 
 authoritarianism: "Authoritarianism"
 authoritarianism_desc: "Authoritarian"
 authoritarianism_noun: "Authoritarianism"
 authoritarian_conservatism: "Authoritarian Conservatism"
 authoritarian_conservatism_desc: "Authoritarian Conservatism characterizes regimes in which military commanders, security apparatuses, or regional strongmen assume direct executive control, typically during periods of state fragmentation or armed conflict. Rejecting both pluralist democracy and mass ideological mobilization, these administrations govern through martial law, emergency decrees, and administrative coercion. They legitimize centralized rule as a necessary measure to maintain public order, secure territory, and preserve established social, national, and religious norms against instability."
 paternalism: "Paternalism"
 paternalism_desc: "Paternalism is an ideology that limits a person's or group's liberty or autonomy and is intended to promote their own good. Paternalism can also imply that the behavior is against or regardless of the will of a person, or also that the behavior expresses an attitude of superiority."
 absolutism: "Absolutism"
 absolutism_desc: "Absolutism is a political doctrine and practice of unlimited centralized authority and absolute sovereignty, as vested especially in a monarch or dictator."
 post_soviet_bureaucracy: "Post-Soviet Bureaucracy"
 post_soviet_bureaucracy_desc: "Post-Soviet bureaucracy is a political ideology, that has emerged in many former Soviet countries. It is characterized by a centralized and authoritarian form of governance, with a strong emphasis on bureaucratic control and management."
 
 ultranationalism: "Ultranationalism"
 ultranationalism_desc: "Ultranationalist"
 ultranationalism_noun: "Ultranationalism"
 social_nationalism: "Social Nationalism"
 social_nationalism_desc: "Social Nationalism is a political ideology based on the idea of the nation as the optimal form of existence of human society, a radical form of nationalism. At the same time, "nation" means a self-sufficient blood-related hierarchical human community — an ethnic community with a single language and self-awareness of national identity, which embodies freedom and justice for its members."
 russian_nationalism: "Russian Nationalism"
 russian_nationalism_desc: "Russian Nationalism is a Russian political ideology, which was derived from nostalgia predominantly over Russian Empire and White Army movement, and resentment towards countries, which opposed Russia during history."
 neofascism: "Neo-Fascism"
 neofascism_desc: "Neo-Fascism is a political ideology, born after World War II, which includes many elements of fascism and opposes modern world establishment. Though, allegiance of groups, who are claimed to be neo-fascists, to this ideology might be strongly contested."
 neonazism: "Neo-Nazism"
 neonazism_desc: "Neo-Nazism comprises the post–World War II militant, social, and political movements that seek to revive and reinstate Nazi ideology. Neo-Nazis employ their ideology to promote hatred and racial supremacy, attack racial and ethnic minorities, and in some cases to create a fascist state."
 national_bolshevism: "National Bolshevism"
 national_bolshevism_desc: "National-bolshevism is a political ideology which combines ultranationalism with bolhevik communism. National-bolsheviks embrace nazi theories and combine it with bolshevism elements, such as class war and red terror."
 neoeurasianism: "Neoeurasianism"
 neoeurasianism_desc: "Neoeurasianism is a political theory, created by a Russian far-right philosopher Aleksandr Dugin. Neoeurasianism states, that Eurasian continent should be united into one superstate with Russia in it's core, eradicating European culture and identity, while embracing alliances with 'non-white civilizations'."
 national_christianity: "National-Christianity"
 national_christianity_desc: "National Christianity is a revolutionary, militant synthesis of radical nationalism and religious fundamentalism, associated with Dmytro Korchynskyi's 'Brotherhood' movement. Unlike conventional religious conservatism, it rejects passive clericalism and secular state bureaucracy alike, advocating for a 'Christian Revolution' as a prerequisite for national liberation. Its proponents seek to organize society around armed religious-military orders and insurgent communities dedicated to uncompromising struggle against secular liberalism and foreign imperialism."
 
 esotericism: "Esotericism"
 esotericism_desc: "Esoteric"
 esotericism_noun: "Esotericism"
 neopaganism: "Esoteric Traditionalism"
 neopaganism_desc: "Esoteric Traditionalism is a combination of mystical theories and traditionalist ideas and dogmas. Focusing on the preservation of the heritage of their ancestors, its adherents also returned to the concept of polytheism. Its Slavic variant aims to restore the status of Slavic paganism as the dominant faith and to preserve and continue both regional and folk customs."
 satanism: "Satanism"
 satanism_desc: "Satanism is a group of various beliefs, embracing and worshiping Satan, also mentioned as Devil in christianity, a fallen angel, who tempt humans into sin, with other demons, mentionied in The Bible."
 
 oligarchism: "Oligarchism"
 oligarchism_desc: "Oligarchic"
 oligarchism_noun: "Oligarchism"
 patronalism: "Patronalism"
 patronalism_desc: "Patronalism refers to a political and economic system in which formal state institutions are subordinated to informal networks of oligarchs, regional elites, and business clans. Rather than operating on ideological principles or party platforms, political competition revolves around clientelism, media control, and the distribution of state resources, monopolies, and administrative offices through personal loyalty."
 
 
