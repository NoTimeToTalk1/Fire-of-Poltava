 DniproBankUnifierDesc: "Ukrainian crisis has a new push. Left bank of Ukraine got united under the rule of the so-called 'Conglomerate', by various sources led by former Ukrainian oligarchs. They are pursuing the goal of uniting whole Ukraine under their rule, known as some people as 'capitalist utopia' or 'neo-serfdom'."
 HalychynaFinalUnifierDesc: "Ukraine has finally been unified. Led under Ruslan Koshulynskyi, his government was successful in uniting the country. Bringing peace to the broken country, citizens are widely celebrating across the country. Ukraine awaits years of rebuilding, but the government is ready for it."
 RivneFinalUnifierDesc: "Ukraine has finally been unified. It became possible under the banner of the former criminal authorities, who claimed themselves such tremendous amount of powers as the whole country instead of their former jails. Establishing their own rules, they are leading the country now."
 TernopilFinalUnifierDesc: "Ukraine has finally been unified. Esotericists, who started from festival in Ternopil, have claimed whole Ukraine for themselves. The country now faces a process of reshaping from secular state into old slavic traditions, going quite back in technological development and converting everyone into old slavic faith."
 VolhyniaFinalUnifierDesc: "Ukraine has finally been unified. Led under Yuriy Lutsenko, his government was successful in uniting the country. Bringing peace and stability to the broken country, citizens are widely celebrating across the country. Ukraine awaits years of rebuilding, but the government is ready for it."
 ZhytomyrFinalUnifierDesc: "Ukraine has finally been unified. Led under Yulia Tymoshenko, her government was successful in uniting the country. Bringing peace to the broken country, citizens are widely celebrating across the country. Ukraine awaits years of rebuilding, but the government is ready for it."
 VinnytsiaFinalUnifierDesc: "Ukraine has finally been unified. Led under Oleh Liashko, his government was successful in uniting the country. Bringing peace to the broken country, citizens are widely celebrating across the country. Ukraine awaits years of rebuilding, but the government is ready for it."
 KyivFinalUnifierDesc: "Ukraine has finally been unified. Led under Volodymyr Zenelskyy, his government was successful in uniting the country. Bringing peace to the broken country, caused by the turmoil around his inauguration in 2019, citizens are widely celebrating across the country. Ukraine awaits years of rebuilding, but the government is ready for it."
 ChernihivFinalUnifierDesc: "Ukraine has finally been unified. Led under Petro Poroshenko, his government was successful in uniting the country. Bringing peace and stability to the broken country, caused by the turmoil around his protest to the new government in 2019, citizens are widely celebrating across the country. Ukraine awaits years of rebuilding, but the government is ready for it."
 YushchenkoFinalUnifierDesc: "Ukraine has finally been unified. Led under Viktor Yushchenko, his government was successful in uniting the country. Bringing peace and stability to the broken country, citizens are widely celebrating across the country. Ukraine awaits years of rebuilding, but the government is ready for it. President Yushchenko is finally able to picture Ukraine into his view."
 SmeshkoFinalUnifierDesc: "Ukraine has finally been unified. Led under Ihor Smeshko, his government was successful in uniting the country. Bringing peace and stability to the broken country, citizens are widely celebrating across the country. Ukraine awaits years of rebuilding, but the government is ready for it."
 PoltavaFinalUnifierDesc: "Ukraine has finally been unified. Adnriy Biletskii, leader of the new 'Ukrainian National State', has managed to unite the country under his banner. In his speech he has claimed, that Ukraine and Ukrainian people will finally begin to live for the sake of Ukrainian nation, claiming Ukraine only for Ukrainians and nobody else."
 KirovohradFinalUnifierDesc: "Ukraine has been brought under the control of communist leader Dmitriy 'Goblin' Puchkov. Continuing his methods, he claims, that Ukraine will finally be brought into the 'Russian world'. Throughout whole Ukraine, mass ruthless actions, done by the government, can be named as a continuation of 'red terror'."
 UmanFinalUnifierDesc: "Ukraine has finally been unified. The unifier is none other, than Moshe Reuven Azman, leader of the hassidic movement. Ukrainian people are celebrating across the whole country. In Moshe's speech, he said, that Ukraine entered peace, and Ukrainian people from now on will be living in peace and harmony, adopting the hassidic faith."
 OdesaFinalUnifierDesc: "Ukraine has finally been unified. Brought to order by the government of the admiral Ihor Voronchenko, Ukraine will beging the long period of reconstruction, claimed in his speech. From the changes proposed, the military will have more say, and Ukraine's structure is changing to the confederative one."
 SternenkoFinalUnifierDesc: "Ukraine has finally been unified. It was done under the banner of Ukrainian liberal nationalist Serhiy Sternenko. In his speech, he claims, that Ukraine was finally brought to peace, and he will do everything needed to build a country for Ukrainian people with high living standarts and removing any criminal and oligarchic influence from Ukraine, including the Russian one."
 ShariyFinalUnifierDesc: "Ukrainian has finally been unified. The unifier, Anatoliy Shariy, claims that Ukraine will be transformed by his vision. The first steps he calls in his program are the normalization of the relations with Russia and persecution of 'those, who oppose the will of the people', whoever that may be."
 BudzhakFinalUnifierDesc: "Ukraine was brought under the full control of the 'Nations Council'. Throughout whole Ukraine, the celebrations are taking place, from Ukrainians and other nations, living at the territory of Ukraine. In the council's speech, it claims, that former territory of Ukraine is going to be known as a place for any nations to peacefuly coexist with each other."
 RECFinalUnifierDesc: "Ukraine was brought under the control of the Russian Expeditionary Corps. No reinstatement of Ukrainian state is being seen. Instead, the project of splitting Ukraine into federal disctricts and joining them to Russia are heard from the insiders in the Kremlin. Ukrainian territory is engulfed into mass protests and partisan action against the Russian administration, while it gets ready to long anti-partisan fight."
 KhersonFinalUnifierDesc: "Ukraine has finally been unified. The government of Vadim Rabinovich has managed to unite the ruined Ukraine, and following from the official speech, the government will be rebuilding Ukraine on the federative platform, giving regions wide autonomy, and securing positive relationships with the neighbouring countries."
 ZaporizhzhiaFinalUnifierDesc: "Ukraine has finally been unified. The new government's leader, Tyler Anderson, has issued a statement, where he declared the end of the Ukrainian ruin and the start of a new Ukrainian era, where Ukraine will be rebuilt and will provide it's citizens, free from prejudice, based on gender, sexual orientation, race or ethnical heritage."
 AvakovFinalUnifierDesc: "Ukraine has been brought to stability by the Arsen Avakov's government. He has managed to unite Ukraine and bring order to the ruined country. However, coming from various reports, it seems that the government is too centered on bringing order, resulting in ban of mass gatherings and persecution of any opposition, resulting into building a somewhat police state."
 ZhadanFinalUnifierDesc: "Ukraine has finally been unified. Serhiy Zhadan's government has managed to unify Ukraine, with celebrations taking part across the country. In his statement, he declared a period of rebuilding Ukraine, also declaring his beliefs in creating a truly prosperous and free Ukrainian state."
 FreicorpsFinalUnifierDesc: "Ukraine has finally been unified. The Freicorps government has managed to unite Ukrainian state, and in their statement they have declared a beginning of restructuring Ukraine to the ideals of right-wing nationalism."
 AzovFinalUnifierDesc: "Ukraine has finally been unified. Government, led by the leaders of the nationalist 'Azov' regiment, [UKR.GetLeader] has issued an official statement. In this statement, he claims that Ukraine will undergo the transformation into a new state, based on the Ukrainian nation and it's contribution to the Ukraine National State. Some experts claim, that their clash with Russia is inevitable."
 DanilovFinalUnififerDesc: "Ukraine has finally been unified. Throughout the whole country, people are celebrating the end of the disarray. Head of the Ukrainian government, Oleksiy Danilov, has issued a statement, where he claims to rebuild Ukraine from the ruins. From the vector of his politics, it seems that he will strengthern ties with the West, and will deal with the Russian agression."
 SavchenkoFinalUnifierDesc: "Ukrainian has finally been unified. People of Ukraine are celebrating, while the government, led by Nadiya Savchenko, united the country. Nadiya issued a statement, where she adressed a hard period of reconstruction ahead, and yet she promised to help all Ukrainian people throughtout this period, and build a state with people at it's focus."
 KhomutFinalUnifierDesc: "Ukraine has finally been unified. Ukrainian people celebrate across the country, as government, led by Vitaliy Khomutynnik, unites the country. Vitaliy issued a statement, where he promised people of Ukraine to rebuild the country and create a prosperous state without any discrimination and radicalism across the country."
 KryvonosFinalUnifierDesc: "Ukraine has finally been unified. Following the unification, the military government, led by Serhiy Kryvonos, has enacted a martial law across the whole country. Serhiy Kryvonos has issued a statement, where he adressed, that he will rebuild Ukraine in next several years, while keeping order and stability across the whole country, not letting any 'destructive elements' to ruin Ukraine again."
 PidorFinalUnifierDesc: "Ukraine has been overruled by the forces of 'Novorossia' movement, led by Denis Pushilin. In his statement, he claims to create a confederation of Ukrainians and 'Novorossians' on the territory of former Ukraine, and to begin talks about joining Russia on the rights of 'People's Republics'."
 HuyFinalUnifierDesc: "Ukraine has been overruled by the forces of 'Novorossia' movement, led by Leonid Pasechnik. In his statement, he claimed to divide Novorossia from Ukraine, and let Novorossia exist as an independent country, seceding from Ukraine at last."
 VitrenkoFinalUnifierDesc: "Ukraine has finally been unified. Led by Nataliya Vitrenko, her government has brought old Soviet Union to Ukraine. Nataliya also claimed to divide Ukraine into a federation of 'Galicians, Ukrainians and Novorossians', all while establishing friendly relations with the 'brotherly slavic' nations of Belarus and Russia."
 GirkinFinalUnifierDesc: "Ukrainian territories got overruled by the 'Empire of Rus' forces, led by tsar Rostislav I from the Romanov dynasty. In his statement, visibly uncomfortable, he claimed that his state will begin a new age in history, claiming himself the title of 'Emperor of all Russias'. By various sources, it is claimed that the country is ruled not by Rostislav himself, but by his prime-minister Igor Girkin. Only the time can tell what will be in the future."
 RostislavFinalUnifierDesc: "Ukrainian territories got overruled by the new 'Empire of Rus' state, led by tsar Rostislav I from the Romanov dynasty. In his statement, he claimed that his state will open a new page in the history of Rus, ensuring the coexistence of people, living in Ukraine, and providing the liberties for all the people settling here."
 MariaFinalUnifierDesc: "Ukrainian territories got overruled by the 'Novorossian Governorate' forces, led by tsaritsa Maria I from the Romanov dynasty. In her statement, she claimed to return the glory of Russian Empire, pointing to the possible conflict between her state and Russian Federation."
 GeorgeFinalUnifierDesc: "Ukrainian territories got overruled by the 'Novorossian Governorate' forces, led by tsar George I from the Romanov dynasty. In his statement, he claimed to return the glory of Russian Empire, pointing to the possible conflict between his state and Russian Federation."
 DniproFinalUnifierDesc: "Ukraine has finally been unified under the forces of the 'Conglomerate'. The country is predicted to be transformed into a corporation-state, with people seen merely as an employees, and the government ruling like a board of directors. Despite not being recognized as a state, various sources claim an interest from notorious billionaires and trans-national corporations has spiked with the unification."


