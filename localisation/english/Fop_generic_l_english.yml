 ### Micro region development

 FOP_micro_region_development: "Development"
 FOP_micro_region_development_desc: "Ukraine is in ruins, and so is our piece of land. If we want to prosper, we should overlook our posibilities and control it as much, as we can do."
 FOP_micro_region_development_tt: "After completion of some focuses, you will be able to make §Ydecisions§! for your development"
 FOP_warehouses: "Search Warehouses"
 search_warehouse_1: "Search warehouse"
 search_warehouse_1_desc: "We will look into stockpiles and warehouses of weapons. We need them for our's sake, and not looking for additional firepower would be stupid."
 search_warehouse_2: "Search warehouse"
 search_warehouse_2_desc: "We will look into stockpiles and warehouses of weapons. We need them for our's sake, and not looking for additional firepower would be stupid."
 search_warehouse_3: "Search warehouse"
 search_warehouse_3_desc: "We will look into stockpiles and warehouses of weapons. We need them for our's sake, and not looking for additional firepower would be stupid."
 issue_propaganda_material: "Issue Propaganda Material"
 issue_propaganda_material_desc: "Masses should get our messages right. We will invest in agitation and propaganda to get people's sympathy for our cause."
 economic_concessions: "Make economic concessions"
 economic_concessions_desc: "People, in general, love less work and more benefits. In exchange of their loyalty for us, we will make some concessions to them."
 invest_in_social_buildings: "Invest in social buildings"
 invest_in_social_buildings_desc: "Hospitals, schools, recreational zones... People must have that for their life to be easier. We will invest in building some of that, and people surely will give us their 'Thank you'."
 FOP_earn_trust: "Gaining Trust"
 FOP_appeasement: "Appeasment"
 invest_in_populace_control: "Invest in populace control"
 invest_in_populace_control_desc: "Situation in our country causes people to get involved into harmful and chaotic activites, which are obviously bad for us. We should invest into punishing that kind of behaviour."
 police_raid: "Police raid"
 police_raid_desc: "Some people are getting involved into illegal activites, thus we shall exert some police brutality for maintaining order. We should also be aware, that people wouldn't like that."
 FOP_mobilisation: "Mobilization"
 mobilize_small_amount: "Mobilize small amount of people"
 mobilize_small_amount_desc: "Our army must get fresh manpower to uphold it's capabilities. We will start mobilizing a small amount of reserves, mostly from people, willing to help."
 mobilize_medium_amount: "Mobilize medium amount of people"
 mobilize_medium_amount_desc: "Our army must get fresh manpower to uphold it's capabilities. We will start a mobilization campaign, which will target former soldiers and people, eligible for serving in the military."
 mobilize_large_amount: "Mobilize large amount of people"
 mobilize_large_amount_desc: "Our army must get fresh manpower to uphold it's capabilities. We should do a large mobilization campaign in order to firmly replenish our forces, no matter what the people will say."
 put_them_to_serve: "Put criminals to serve"
 put_them_to_serve_desc: "People, who got sentenced to prison, are more of a burden to us. They get food and sleeping place from our budget, so we know a better place, where they can be more useful for us."
 
 ### Focus tree and events
 FOP_Fire_Of_Poltava: "Fire Of Poltava"
 FOP_Fire_Of_Poltava_desc: "After the events in Poltava, when representatives of various political entities got into massive fight, our country has broken apart. We must prepare for further hardships."
 FOP_We_Are_Holding: "We Are Holding"
 FOP_We_Are_Holding_desc: "Some time has passed, and we still afloat. We must continue further."
 FOP_Time_To_Reorganise: "Time To Reorganize"
 FOP_Time_To_Reorganise_desc: "In our current situation, keeping the past level of how things had been is impossible. Our forces, our government and our economy should be adapted to current realities."
 FOP_What_About_Army: "What About Army"
 FOP_What_About_Army_desc: "Military is our guarantee for surviving against our neighbors. The question is - what should it be?"
 FOP_Rely_On_Militias: "Rely On Militias"
 FOP_Rely_On_Militias_desc: "Militias are poor, and at the same time fast solution to army structure. With gathering people and giving them guns, we can make up forces pretty fast."
 FOP_Rely_On_Vehicles: "Rely On Vehicles"
 FOP_Rely_On_Vehicles_desc: "Vehicles is the pinnacle of modern war. Those, who have mobile weapons and personnel transporters, can get advantage pretty quickly."
 FOP_Rely_On_Professionals: "Rely On Professionals"
 FOP_Rely_On_Professionals_desc: "Army professionalism is what can make difference in any situation. With finding skilled men for military actions, we can ensure our survival."
 FOP_Gather_Militants: "Gather Militants"
 FOP_Gather_Militants_desc: "We shall gather people to make up our forces. In current situation, we can easily find someone who wants to get a gun and be a hero."
 FOP_Seize_What_We_Can: "Seize What We Can"
 FOP_Seize_What_We_Can_desc: "Our territory is full of different vehicles, for which we can find usage. Police depots and military bases should be searched for them."
 FOP_Search_For_Skilled_Personnel: "Search For Skilled Personnel"
 FOP_Search_For_Skilled_Personnel_desc: "Our lands may have many professionals, who are currently retired or working elsewhere. We should bring them to our forces."
 FOP_Making_Up_General_Staff: "Making Up General Staff"
 FOP_Making_Up_General_Staff_desc: "Military command is important in controlling forces, so a new general staff should be made up of people, skilled enough to command army groups."
 FOP_Find_Warehouses: "Find Warehouses"
 FOP_Find_Warehouses_desc: "Infantry equipment is stored within many points on our territory, and now the time has come to get them for usage."
 FOP_Mobilisation: "Mobilization"
 FOP_Mobilisation_desc: "Security cannot exist without people, who secure the state. Considering new times, people shall be mobilized for military."
 FOP_Prepare_Equipment_Production: "Prepare Equipment Production"
 FOP_Prepare_Equipment_Production_desc: "It is good that we can use what was left for us, but it will not be unnecessary to product our own equipment, so we will not be left without nothing at some time."
 FOP_Bad_Times: "Bad Times"
 FOP_Bad_Times_desc: "Ruin has come to our lands. We must think of how we treat that situation, whether we will get harsher to endure, or let the people live more happily in such crap."
 FOP_Require_Better_Treatment: "Require Better Treatment"
 FOP_Require_Better_Treatment_desc: "Why should we not care about our own people? We shall ease up their suffering and be a human-centric government, so they will accept us."
 FOP_Make_Strong_People: "Make Strong People"
 FOP_Make_Strong_People_desc: "Why should we care about wishes of our people, when we are struggling to survive? We shall get stronger and harsher rule, so that we will meet new challenges easily."
 FOP_Reorganise_The_Administration: "Reorganize The Administration"
 FOP_Reorganise_The_Administration_desc: "Old times are slowly waning away, and our administration cannot work like it had been in past. Reorganisation of administration from local to independent will help us in new times."
 FOP_Appease_The_Populace: "Appease The Populace"
 FOP_Appease_The_Populace_desc: "People are making mess everywhere, striking and going mad. They should be appeased for the sake of our stability."
 FOP_Earn_The_Trust: "Earn The Trust"
 FOP_Earn_The_Trust_desc: "Believe it or not, people have trusted ukrainian government to some extent, and seeing new leaders will be troubling for them. We should get their trust, and they will come handy in the future."
 FOP_Its_Fine: "It's Fine"
 FOP_Its_Fine_desc: "While we are living in this mess, we still live, isn't that right? We made everything we could, and we are going more or less stable."
 FOP_No_Time_To_Whine: "No Time To Whine"
 FOP_No_Time_To_Whine_desc: "People should adapt to new realities, and it will be best for them, if they want to live on. We won't be listening to small cries, while we are fixing huge problems."
 FOP_We_Will_See_The_Future: "We Will See The Future"
 FOP_We_Will_See_The_Future_desc: "Even in the darkest times, there always has been a glimpse of light, coming for guidance for the future, and we will embrace the glimpse of future possibilities, which are yet to come!"
 FOP_Look_Into_Industry: "Look Into Industry"
 FOP_Look_Into_Industry_desc: "Industry is what allows us to eat and exist in modern human civilization. We shall look into it to see how we can adapt it for new times."
 FOP_The_More_The_Better: "The More The Better"
 FOP_The_More_The_Better_desc: "There is no time for us to concentrate on quality products, while we do not have enough of that. Ramp up the production en masse!"
 FOP_Concentrate_Product_Quality: "Concentrate Product Quality"
 FOP_Concentrate_Product_Quality_desc: "Quality means reliability and confidence. It will be stupid of us to neglect that aspect, so watch closely for producting high-class products!"
 FOP_Stabilize_Production: "Stabilize Production"
 FOP_Stabilize_Production_desc: "Various industrial complexes are living by themselves as for now. It's not right, so it's better to coordinate their efforts for more effective production."
 FOP_Expand_Factories: "Expand Factories"
 FOP_Expand_Factories_desc: "In past, government would only invest in factories, which they've seen best only for those with money, not for the state. Now, expanding industrial capacities is a necessity."
 FOP_Organize_Workers: "Organize Workers"
 FOP_Organize_Workers_desc: "Industry cannot function without workers. We shall gather and organize workers for the sake of industrial production."
 FOP_The_More_We_Work_The_Better_Our_Chances: "The More We Work The Better Our Chances"
 FOP_The_More_We_Work_The_Better_Our_Chances_desc: "Economical situation is directly proportional to amount of work which was put in that. More work means more possibilities and chances for survival."
 FOP_Rudimentary_Resource_Production: "Rudimentary Resource Production"
 FOP_Rudimentary_Resource_Production_desc: "When Ukraine has fallen to chaos, many western investors and companies tried to get away as much as possible. Markets are closed for us too, so we need to organize own resources production to keep up our industry."
 FOP_Jumpstart_The_Industry: "Jumpstart The Industry"
 FOP_Jumpstart_The_Industry_desc: "We made many efforts towards that, so we should come to our new industrial capabilities!"

 ### CORE START ###
 FOP_We_Stand_On_Ground: "We Stand on Solid Ground"
 FOP_We_Stand_On_Ground_desc: "Despite chaos and uncertainty, we still hold territory, people, and purpose. This is our starting point."
 FOP_Establish_Regional_Administration: "Establish Regional Administration"
 FOP_Establish_Regional_Administration_desc: "Local governance must be restored to maintain order and legitimacy."
 FOP_Appeal_To_The_People: "Appeal to the People"
 FOP_Appeal_To_The_People_desc: "Only public support can legitimize our rule in these difficult times."
 FOP_Open_For_Business: "Open for Business"
 FOP_Open_For_Business_desc: "Economic activity must resume, even under imperfect conditions."

 ### MILITARY BRANCH ###
 FOP_Army_Reorganisation: "Army Reorganisation"
 FOP_Army_Reorganisation_desc: "Our armed forces require structure, doctrine, and discipline."
 FOP_Expand_Staff: "Expand the Staff"
 FOP_Expand_Staff_desc: "A modern army needs a capable and expanded command structure."
 FOP_Weapon_Markets: "Weapon Markets"
 FOP_Weapon_Markets_desc: "If we cannot produce weapons fast enough, we must buy them."
 FOP_Military_Industry_Development: "Military Industry Development"
 FOP_Military_Industry_Development_desc: "Domestic arms production is the backbone of sovereignty."
 FOP_Gather_Munitions_From_Citizens: "Gather Munitions from Citizens"
 FOP_Gather_Munitions_From_Citizens_desc: "Every bullet counts. Even civilian stockpiles must be mobilized."
 FOP_Encourage_Local_Workshops: "Encourage Local Workshops"
 FOP_Encourage_Local_Workshops_desc: "Small-scale production can still sustain the war effort."
 FOP_Recruitment_Issue: "The Recruitment Issue"
 FOP_Recruitment_Issue_desc: "Manpower shortages force us to reconsider who must serve."
 FOP_Who_Was_Made_To_Serve: "Who Was Made to Serve"
 FOP_Who_Was_Made_To_Serve_desc: "Military duty should fall on those most fit for it."
 FOP_Army_Service_Will_Touch_Everyone: "Army Service Will Touch Everyone"
 FOP_Army_Service_Will_Touch_Everyone_desc: "Total mobilization is harsh, but sometimes unavoidable."
