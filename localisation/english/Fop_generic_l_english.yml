 FOP_global_warlord.19.t: "European Union establishes contact with [FROM.GetName]"
 FOP_global_warlord.19.d: "Members of the European Union has issued a joint statement about establishing contact with the [FROM.GetName] government. At this stage, there is no talks about full recognition as a successor of the Republic of Ukraine, but their diplomatic relations start to look friendly towards the state."
 FOP_global_warlord.19.a: "We will look into that"
 FOP_global_warlord.20.t: "Russian Federation establishes contact with [FROM.GetName]"
 FOP_global_warlord.20.d: "Russian Federation government has issued a statement about establishing contact with the [FROM.GetName] government. At this stage, there is no talks about full recognition as a successor of the Republic of Ukraine, but their diplomatic relations start to look friendly towards the state. Following Russian Federation, several countries has followed their steps."
 FOP_global_warlord.20.a: "We will look into that"
 FOP_global_warlord.21.t: "European Union recognizes [FROM.GetName]"
 FOP_global_warlord.21.d: "Members of the European Union has issued a joint statement about recognizing the [FROM.GetName] government as the rightful successor of the Republic of Ukraine. Diplomats are looking forward to open the embassies, and the process of re-establishing contacts with Ukraine has begun."
 FOP_global_warlord.21.a: "Return to normalcy?"
 FOP_global_warlord.22.t: "Russian Federation recognizes [FROM.GetName]"
 FOP_global_warlord.22.d: "Russian Federation has issued a statement about recognizing the [FROM.GetName] government as the rightful successor of the Republic of Ukraine. Diplomats are looking forward to open the embassy, and the process of re-establishing relations has begun. Following the Russian Federation, several other countries also has recognized the state."
 FOP_global_warlord.22.a: "Another Russian interest?"
 
