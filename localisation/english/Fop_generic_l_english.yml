 SternenkoRegionUnifierDesc: "Ukrainian crisis has a new push. South part of Ukraine got united under the banner of the Ukrainian right-wing Right Sector organisation representative Serhiy Sternenko. He claims that he will continue to unite Ukraine, overcoming the biggest crisis in the country's modern history. According to various sources, he either represents liberal-nationalist views or goes by the stern right-wing beliefs. Only time will tell what his rule will look like."
 ShariyRegionUnifierDesc: "Ukrainian crisis has a new push. South part of Ukraine got united under the banner of the former 'Shariy party' leader Anatoliy Shariy. He promises that he will ensure the end of the crisis in Ukraine, and he will bring change for Ukraine to be freer, unlike past oppressive governments."
 BudzhakRegionUnifierDesc: "Ukrainian crisis got some interesting development. South part of Ukraine got united under the banner of the 'Budzhak Nations Council', based in the Izmail raion of Odesa oblast. The council members declare that they are going to create a new state, a federation of equals, which will grant equal rights and representation for all nations that live in Ukraine, and they ensure that they will continue until that project is implemented fully."
 RECRegionUnifierDesc: "Ukrainian crisis got some unforeseen development. South part of Ukraine got united under the banner of the Russian Expeditionary Forces, a military mission sent by the Russian Federation. While the mission representatives and Russian officials claim that the forces ensure the safety and order in the controlled region, there are signs of worrisome administration behaviour, such as Russian passport distributions and harsh actions against those deemed as extremist elements."
 KhersonRegionUnifierDesc: "Ukrainian crisis has a new push. South part of Ukraine was united under the government of the former 'Opposition Platform - For Life' leader Vadim Rabinovich. He claims that he will unite Ukraine, transform it into a federation with every region's culture and language treated with respect, and will cease any problems of the past Ukrainian government."
 ZaporizhzhiaRegionUnifierDesc: "Ukrainian crisis has a new push. Tavria region, consisting of Kherson and Zaporizhzhia oblasts, got united under the banner of the 'liberal congress', led by former Ukrainian blogger Oleksiy Shkrobinets, more known as Tyler Anderson. The liberals claim that they will unite Ukraine and transform it into a truly liberal and democratic country with every human respected, regardless of their gender, sexual orientation or ethnic background."
 AvakovRegionUnifierDesc: "Ukrainian crisis has a new push. East part of Ukraine was united under the government of the former Ukrainian Minister of Interior Affairs Arsen Avakov. He claims that he will continue uniting Ukraine, bringing order and stability to the now ruined country, and giving a fight to unlawful elements tearing Ukraine apart."
 ZhadanRegionUnifierDesc: "Ukrainian crisis has a new push. East part of Ukraine got united under the government of the Ukrainian poet Serhiy Zhadan. He claims that he will continue uniting Ukraine, bringing peace to the country and trying to save as many people as his government can."
 FreicorpsRegionUnifierDesc: "Ukrainian crisis got some worrisome development. East part of Ukraine got united under the banner of the Freikorps movement. Spokespersons claim that they will continue uniting Ukraine, transforming the country into a state with nationalist beliefs in its core."
 AzovRegionUnifierDesc: "Ukrainian crisis got some worrisome development. East part of Ukraine got united under the banner of the Azov regiment. Spokespersons claim that Azov will continue the unification of Ukraine, transforming it into a new, nationalist state, with the Ukrainian nation at its core, also giving a fight to any threats to it."
 DanilovRegionUnififerDesc: "Ukrainian crisis has a new push. The Donbas region along with Kharkiv oblast got united under the government of Oleksiy Danilov. He claims that he will unite Ukraine, ensuring the return of Ukraine's independent statehood with democratic institutions, also willing to cooperate with the West in solving the Ukrainian crisis."
 SavchenkoRegionUnifierDesc: "Ukrainian crisis has a new push. East part of Ukraine got united under the government of Nadiia Savchenko. She claims that she will continue the unification of Ukraine, also ensuring to bring Ukraine a truly new era without corrupt politics and with a truly people's government, which will help the people with every need."
 KhomutRegionUnifierDesc: "Ukrainian crisis has a new push. East part of Ukraine got united under the government of Vitaliy Khomutynnik. He claims that he will continue the unification of Ukraine, bringing peace to the fallen country and creating a prosperous state with citizens in the first place."
 KryvonosRegionUnifierDesc: "Ukrainian crisis has a new push. East part of Ukraine got united under the military government of the former Ukrainian general Serhiy Kryvonos. He claims that he will bring order to Ukraine, uniting it further and getting rid of anyone who acts on behalf of themselves and not the Ukrainian state."
 PidorRegionUnifierDesc: "Ukrainian crisis got some worrisome development. East part of Ukraine got united under the separatist 'Novorossiya' movement government with it's leader Denis Pushilin. He claims that 'Novorossiya' will continue to expand further, freeing the oppressed peoples of Ukrainian south-eastern territories and uniting with the Russian Federation."
 HuyRegionUnifierDesc: "Ukrainian crisis got some worrisome development. East part of Ukraine got united under the separatist 'Novorossiya' movement government with it's leader Leonid Pasechnik. He claims that 'Novorossiya' will continue to expand further, freeing itself from the oppression of the former Ukrainian state and choosing its own path."
 VitrenkoRegionUnifierDesc: "Ukrainian crisis got some worrisome development. East part of Ukraine got united under the separatist 'Novorossiya' movement government with it's leader Nataliya Vitrenko. She claims that she will continue the unification of Ukraine, and she will transform it into a socialist state, where the rights of oppressed and deprived people will be elevated, and Ukraine will return to the brotherhood of brotherly Eastern Slavic peoples."
 GirkinRegionUnifierDesc: "Ukrainian crisis got some unforeseen development. East part of Ukraine got united under the separatist 'Novorossiya' movement government with it's leader Igor Strelkov. He claims that his goal is to return the monarchy to the Russian lands and will march without hesitation to restore the Russian Empire."
 DniproRegionUnifierDesc: "Ukrainian crisis has a new push. East part of Ukraine got united under the rule of the so-called 'Conglomerate', by various sources led by former Ukrainian oligarchs. They are pursuing the goal of uniting whole Ukraine under their rule, known as some people as 'capitalist utopia' or 'neo-serfdom'."
 HalychynaBankUnifierDesc: "Ukrainian crisis has a new push. Right bank of Ukraine got united under the control of Ruslan Koshulynsky government. He issued a speech, where he claimed that the new provisional government is aiming to maintain stability in the region and to rule out the Ukrainian crisis, pushing the unification further."
 RivneBankUnifierDesc: "Ukrainian crisis got some shady development. Right bank of Ukraine got united under the banner of 'Right-Bank Ukrainian Authoritative', formed by the notorious criminal authorities. Overcoming other forces, they have claimed control over the region, and they have already started bringing their own order to all the people that remain there."
 TernopilBankUnifierDesc: "Ukrainian crisis brings terrifying news. Right bank of Ukraine got united under the banner of neo-pagans, who brought the disorder to Galicia, Volhynia and Zakarpattya, and now they are controlling more territories. Little is known about their next course of action."
 VolhyniaBankUnifierDesc: "Ukrainian crisis has a new push. Right bank of Ukraine got united under the government of the former prosecutor general Viktor Lutsenko, who first brought stability to the Galicia, Volhynia and Zakarpattya regions, and now he has formed a new provisional government in the west of Ukraine. His government aims to bring further stability in the region and continue the unification of Ukraine."
 ZhytomyrBankUnifierDesc: "Ukrainian crisis has a new push. Right bank of Ukraine got united under the government of the former Ukrainian prime minister Yulia Tymoshenko. She claims that she will continue uniting Ukraine, bringing peace and stability to the Ukrainian people across the whole ruined country."
 VinnytsiaBankUnifierDesc: "Ukrainian crisis has a new push. Right bank of Ukraine got united under the government of the Ukrainian ‘Radical Party’ leader Oleh Liashko. He claims that he will continue uniting Ukraine, bringing peace and stability to the Ukrainian people across the whole ruined country, also fighting with the elements, who will stand in the way of uniting Ukraine."
 KyivBankUnifierDesc: "Ukrainian crisis has a new push. Right bank of Ukraine got united under the government of Volodymyr Zelensky, recognised as the sixth president of Ukraine before the start of the crisis. Overcoming his opponents, he has declared that he will continue to help Ukraine recover from the crisis and unite Ukraine again, while his government will do anything possible to help the people of Ukraine."
 ChernihivBankUnifierDesc: "Ukrainian crisis has a new push. Right bank of Ukraine got united under the government of the former fifth president of Ukraine, Petro Poroshenko. In his speech, he declared that he will ensure the further unification and restoration of the Ukrainian state, dealing with the greatest crisis in modern Ukrainian history and its perpetrators."
 YushchenkoBankUnifierDesc: "Ukrainian crisis has a new push. Right bank of Ukraine got united under the government of the former third president of Ukraine, Viktor Yushchenko. Known as both a pro-western, pro-Ukrainian politician and leader, whose team failed to deliver the expectations, he promises to ensure a bright future for Ukraine, learning from the errors of the past and to continue the unification of Ukraine."
 SmeshkoBankUnifierDesc: "Ukrainian crisis has a new push. Right bank of Ukraine got united under the government of the Ukrainian politician Ihor Smeshko. In his speech, he declared that he will bring order and stability to the country, engaging in its unification and creating a powerful Ukrainian state."
 PoltavaBankUnifierDesc: "Ukrainian crisis has a worrisome development. Right bank of Ukraine got united under the government of the far-right 'Natskorpus' party leader, Andrii Biletski. In his speech, he claimed that he will continue to further unify Ukraine and transform not only the country, but the nation as well, under the social-nationalist ideology."
 KirovohradBankUnifierDesc: "Ukrainian crisis got some worrying developments. Right bank of Ukraine got united under the banner of the former Russian media person Dmitriy 'Goblin' Puchkov. Known for his eccentric and odious demeanour, he claims the return of Ukrainians to the Russian world is inevitable, and he will deliver that under the ideas of Stalinist communism."
 UmanBankUnifierDesc: "Ukrainian crisis got some interesting development. Right bank of Ukraine got united under the banner of the Hassidic community, led by the former Chief Rabbi of Ukraine, Moshe Reuven Azman. He claims that he will be uniting Ukraine under the laws of the Hassidic tradition, bringing peace to the people of Ukraine and reformed Ukrainian state."
 OdesaBankUnifierDesc: "Ukrainian crisis has a new push. Left bank of Ukraine got united under the military government of the Ukrainian admiral Ihor Voronchenko. Putting down the unrest in the region, he has claimed that he will bring order to Ukraine, uniting the country further."
 SternenkoBankUnifierDesc: "Ukrainian crisis has a new push. Left bank of Ukraine got united under the banner of the Ukrainian right-wing Right Sector organisation representative Serhiy Sternenko. He claims that he will continue to unite Ukraine, overcoming the biggest crisis in the country's modern history. According to various sources, he either represents liberal-nationalist views or goes by the stern right-wing beliefs. Only time will tell what his rule will look like."
