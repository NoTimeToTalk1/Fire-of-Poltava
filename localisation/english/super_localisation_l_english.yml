l_english:
  SP_Event_odessa_war: "The war in Odesa"
  SP_Event_odessa_war_QUOTE: "On the one hand, Odesa is washed by the sea, on the other - by the steppe. The steppe is Ukrainian, the sea is international. \n- Lev Slavin"
  SP_Event_odessa_war_REMARK: "The baklava's gone bad."
  SP_Event_russian_ukraine_war: "Russian-Ukrainian War"
  SP_Event_russian_ukraine_war_QUOTE: "You need to grit your teeth and be cruel - then you will win. \n- Erich Maria Remarque"
  SP_Event_russian_ukraine_war_REMARK: "You wanted this land?"
  SP_Event_rdk_win: "Liberation of Russia"
  SP_Event_rdk_win_REMARK: "Justice at last."
  SP_Event_rdk_win_QUOTE: "Faith creates miracles, the one who believes, who honestly and courageously walks the path indicated to him by his conscience, he will overcome. \n- Pyotr Wrangel"